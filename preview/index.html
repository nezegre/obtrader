<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ObTrader Live</title>
    <meta name="description" content="ObTrader — live crypto order book, whale order alerts and price alarms.">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #000000; color: #eaecef; padding: 10px; -webkit-user-select: none; }
        
        /* Üst Header Bar */
        .app-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 5px; border-bottom: 1px solid #1e2329; margin-bottom: 10px; }
        .app-title { font-size: 18px; font-weight: bold; color: #fff; display: flex; align-items: center; gap: 8px; }
        .app-title span { color: #16f7d1; font-size: 10px; background: rgba(22, 247, 209, 0.15); padding: 2px 6px; border-radius: 4px; font-weight: 800; letter-spacing: 0.5px; }

        /* Dil Seçici */
        .lang-select {
            background: #121418;
            color: #16f7d1;
            border: 1px solid rgba(22, 247, 209, 0.3);
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 11px;
            font-weight: bold;
            outline: none;
            cursor: pointer;
        }

        /* Kategori Sekmeleri */
        .tabs-container { display: flex; align-items: center; border-bottom: 1px solid #1e2329; margin-bottom: 12px; gap: 8px; overflow-x: auto; }
        .tabs { display: flex; gap: 12px; font-size: 13px; color: #848e9c; }
        .tab { padding: 6px 10px; cursor: pointer; white-space: nowrap; border-bottom: 2px solid transparent; transition: all 0.2s; }
        .tab.active { color: #fff; font-weight: bold; border-bottom-color: #16f7d1; }
        
        .btn-add-tab { 
            background: rgba(22, 247, 209, 0.1); 
            color: #16f7d1; 
            border: 1px solid rgba(22, 247, 209, 0.3); 
            width: 24px; 
            height: 24px; 
            border-radius: 4px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: bold;
            margin-bottom: 4px;
            flex-shrink: 0;
        }

        /* WATCH GRID */
        .watch-grid { 
            display: grid; 
            grid-template-columns: repeat(2, minmax(0, 1fr)); 
            gap: 8px; 
            margin-bottom: 15px; 
        }

        @media (min-width: 768px) {
            .watch-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
        }

        .card { 
            background: #121418; 
            border: 1px solid #1e2329; 
            border-radius: 8px; 
            padding: 10px; 
            position: relative; 
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 90px;
        }
        .card.active { border-color: #16f7d1; }
        
        .card-header { display: flex; justify-content: space-between; align-items: center; }
        .symbol-name { font-size: 13px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 4px; min-width: 0; overflow: hidden; white-space: nowrap; }
        html, body { max-width: 100%; overflow-x: hidden; overscroll-behavior-x: none; }
        .card { min-width: 0; }
        .card-header { min-width: 0; gap: 4px; }
        .exchange-badge { font-size: 9px; background: rgba(255, 255, 255, 0.1); color: #848e9c; padding: 1px 4px; border-radius: 3px; }
        .header-right { display: flex; align-items: center; gap: 6px; }
        .change { font-size: 11px; font-weight: 600; }
        
        .up { color: #0ecb81; }
        .down { color: #f6465d; }

        .more-btn { 
            color: #ffffff; 
            font-size: 20px; 
            font-weight: bold;
            padding: 2px 6px; 
            cursor: pointer; 
            line-height: 1;
            position: relative;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
        }
        .more-btn:hover {
            background: rgba(22, 247, 209, 0.2);
            color: #16f7d1;
        }
        .has-alarm::after {
            content: '';
            position: absolute;
            top: 2px;
            right: 2px;
            width: 6px;
            height: 6px;
            background-color: #16f7d1;
            border-radius: 50%;
        }

        .card-body { display: flex; justify-content: center; align-items: center; flex-grow: 1; }
        .price { font-size: 16px; font-weight: 700; font-family: monospace; color: #fff; text-align: center; }

        .card-add-box {
            background: #0a0c0e;
            border: 1px dashed #2b313a;
            border-radius: 8px;
            height: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        .card-add-icon { font-size: 28px; color: #16f7d1; font-weight: 300; }

        /* YAN YANA YAPI / GRAFİK VE TAHTA KAPSAYICISI */
        .detail-bar { display: none; }
        #detailView:not(.open) { display: none !important; }
        #detailView.open { position: fixed; inset: 0; z-index: 900; background: #0b0e11; overflow-y: auto; margin: 0; padding: 0 10px 20px; }
        #detailView.open .detail-bar { display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 5; background: #0b0e11; padding: 12px 0 8px; font-weight: bold; color: #eaecef; }
        .detail-back { background: #1e2329; color: #eaecef; border: 1px solid #2b313a; border-radius: 6px; padding: 6px 12px; font-size: 16px; cursor: pointer; }
        body.detail-open { overflow: hidden; }
        .chart-ob-wrapper {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }

        @media (min-width: 900px) {
            .chart-ob-wrapper {
                flex-direction: row;
                align-items: stretch;
            }
            .chart-container-box, .ob-drawer {
                flex: 1;
                margin-top: 0 !important;
            }
        }

        .chart-container-box {
            background: #121418;
            border: 1px solid #1e2329;
            border-radius: 8px;
            padding: 10px;
            height: 400px;
            display: flex;
            flex-direction: column;
        }

        .chart-header {
            font-size: 13px;
            font-weight: bold;
            color: #16f7d1;
            margin-bottom: 8px;
            flex-shrink: 0;
        }

        .tradingview-widget-container {
            flex-grow: 1;
            width: 100%;
            height: 100%;
            min-height: 300px;
        }

        /* CANLI TAHTA VE SCROLL DÜZENİ */
        .ob-drawer { background: #121418; border: 1px solid #1e2329; padding: 12px; border-radius: 8px; }
        .ob-header { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 13px; font-weight: bold; color: #16f7d1; }
        
        .orderbook-table { width: 100%; border-collapse: collapse; font-family: monospace; font-size: 11px; table-layout: fixed; }
        .orderbook-table th { color: #848e9c; font-weight: normal; padding-bottom: 6px; border-bottom: 1px solid #2b313a; text-align: right; }
        .orderbook-table th:first-child { text-align: left; }
        
        .scrollable-table-container {
            height: 260px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #2b313a transparent;
        }
        .scrollable-table-container::-webkit-scrollbar { width: 4px; }
        .scrollable-table-container::-webkit-scrollbar-thumb { background: #2b313a; border-radius: 2px; }

        .orderbook-table tr { height: 22px; position: relative; }
        .orderbook-table td { padding: 3px 4px; text-align: right; font-weight: 500; position: relative; z-index: 2; }
        
        .asks td.price { color: #f6465d; text-align: left; font-weight: 600; }
        .bids td.price { color: #0ecb81; text-align: left; font-weight: 600; }

        /* Ortadaki Sabit Canlı Fiyat Bandı */
        .mid-price-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            margin: 8px 0;
            background: #090a0c;
            border: 1px solid #2b313a;
            border-radius: 6px;
            position: sticky;
            top: 0;
            z-index: 5;
        }
        .mid-price-val { 
            font-size: 17px; 
            font-weight: 800; 
            font-family: monospace; 
            color: #ffffff !important; 
            letter-spacing: 0.5px;
        }
        .mid-price-sub { 
            font-size: 11px; 
            color: #848e9c; 
            font-weight: 600;
        }

        /* Alım / Satım Oran Çizelgesi */
        .ratio-container {
            margin-top: 12px;
            padding-top: 8px;
            border-top: 1px solid #1e2329;
        }
        .ratio-labels {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 4px;
        }
        .ratio-buy-text { color: #0ecb81; }
        .ratio-sell-text { color: #f6465d; }
        .ratio-bar-bg {
            height: 6px;
            width: 100%;
            background: #f6465d;
            border-radius: 3px;
            overflow: hidden;
            display: flex;
        }
        .ratio-bar-fill {
            height: 100%;
            background: #0ecb81;
            width: 50%;
            transition: width 0.3s ease;
        }

        /* MODAL YAPISI & SEARCH DROPDOWN */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 100; padding: 15px; }
        .modal-content { background: #121418; padding: 20px; border-radius: 8px; width: 100%; max-width: 400px; border: 1px solid #2b313a; position: relative; }
        .modal-close-x { position: absolute; top: 12px; right: 15px; color: #848e9c; font-size: 18px; cursor: pointer; font-weight: bold; }
        .modal-content h3 { margin-bottom: 15px; color: #fff; font-size: 15px; border-bottom: 1px solid #2b313a; padding-bottom: 8px; padding-right: 25px; }
        
        .form-group { margin-bottom: 12px; position: relative; }
        .form-group label { display: block; font-size: 11px; color: #848e9c; margin-bottom: 4px; }
        .form-group input[type="text"], .form-group input[type="number"] { width: 100%; padding: 10px; background: #1a1d24; border: 1px solid #363c4e; color: #fff; border-radius: 4px; font-size: 13px; outline: none; transition: border-color 0.2s; }
        .form-group input[type="text"]:focus { border-color: #16f7d1; }

        /* ARAMA DROPDOWN BİLEŞENİ */
        .search-results-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #1a1d24;
            border: 1px solid #363c4e;
            border-top: none;
            border-radius: 0 0 6px 6px;
            max-height: 180px;
            overflow-y: auto;
            z-index: 110;
            display: none;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
        }
        .search-results-dropdown.active { display: block; }
        .search-item {
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #fff;
            cursor: pointer;
            border-bottom: 1px solid #2b313a;
        }
        .search-item:last-child { border-bottom: none; }
        .search-item:hover { background: rgba(22, 247, 209, 0.15); color: #16f7d1; }
        .search-exchange-tag {
            font-size: 10px;
            padding: 2px 6px;
            background: #2b313a;
            color: #16f7d1;
            border-radius: 3px;
            font-weight: bold;
        }
        .no-result-item { padding: 10px; font-size: 12px; color: #848e9c; text-align: center; }

        .radio-group { display: flex; gap: 15px; margin-top: 6px; }
        .radio-option { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #eaecef; cursor: pointer; }
        .radio-option input { accent-color: #16f7d1; }

        .active-alarms-box { background: #000000; border: 1px solid #2b313a; border-radius: 4px; padding: 8px; margin-top: 10px; }
        .active-alarms-title { font-size: 11px; color: #16f7d1; font-weight: bold; margin-bottom: 6px; }
        .alarm-item { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: #eaecef; background: #1a1d24; padding: 5px 8px; border-radius: 3px; margin-bottom: 4px; }
        .alarm-delete { color: #f6465d; cursor: pointer; font-weight: bold; }

        .modal-buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 15px; }
        .btn { padding: 10px 16px; border-radius: 4px; border: none; font-weight: bold; cursor: pointer; font-size: 12px; }
        .btn-add { background: #16f7d1; color: #000000; }
        .btn-tg { background: #229ED9; color: #fff; width: 100%; margin-top: 10px; font-size: 13px; }
        .tg-hint { font-size: 10px; color: #848e9c; text-align: center; margin-top: 5px; }
        .btn-close { background: #363c4e; color: #fff; }

        .remove-coin-link { display: block; text-align: center; color: #f6465d; font-size: 11px; margin-top: 15px; cursor: pointer; text-decoration: underline; }

        .toast-container { position: fixed; bottom: 20px; left: 15px; right: 15px; z-index: 200; pointer-events: none; }
        .toast { background: #16f7d1; color: #000000; padding: 12px 16px; border-radius: 6px; font-weight: bold; font-size: 12px; margin-top: 8px; box-shadow: 0 4px 12px rgba(22, 247, 209, 0.3); animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
</head>
<body>

    <div class="app-bar">
        <div class="app-title">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" width="24" height="24">
              <defs>

              <path fill="url(#tGradient)" d="M197 375 L571 377 L571 541 L586 583 L591 626 L586 679 L571 720 L571 897 L588 898 L680 897 L680 377 L1060 376 L981 290 L275 290 Z"/>
            </svg>
            OBTRADER <span>LIVE</span>
        </div>
        <select class="lang-select" id="langSelect" onchange="changeLanguage(this.value)">
            <option value="en" selected>EN 🇺🇸</option>
            <option value="zh">ZH 🇨🇳</option>
            <option value="tr">TR 🇹🇷</option>
            <option value="de">DE 🇩🇪</option>
            <option value="ko">KO 🇰🇷</option>
            <option value="es">ES 🇪🇸</option>
            <option value="ar">AR 🇸🇦</option>
            <option value="fr">FR 🇫🇷</option>
        </select>
    </div>

    <div class="tabs-container">
        <div class="tabs" id="tabList"></div>
        <button class="btn-add-tab" onclick="createNewTab()" id="btnNewTabTitle" title="New List">＋</button>
    </div>

    <div class="watch-grid" id="watchGrid"></div>

    <!-- GRAFİK VE TAHTA YAN YANA / ÜST ÜSTE ALANI -->
    <div class="chart-ob-wrapper" id="detailView">
        <div class="detail-bar"><button class="detail-back" onclick="closeDetail()">←</button><span id="detailTitle"></span></div>
        <!-- TRADINGVIEW CHART ALANI -->
        <div class="chart-container-box">
            <div class="chart-header" id="chartSymbolTitle">BTC/USDT Chart</div>
            <div class="tradingview-widget-container" id="tvChartContainer"></div>
        </div>

        <!-- TAHTA ALANI -->
        <div class="ob-drawer">
            <div class="ob-header">
                <span id="activeSymbolTitle">BTC/USDT</span>
                <span style="display:flex;gap:8px;align-items:center"><span style="color: #848e9c; font-size: 11px;" id="lblDepth">Depth</span><select id="obGroup" onchange="onGroupChange(this.value)" title="Group" style="background:#1e2329;color:#eaecef;border:1px solid #2b313a;border-radius:4px;font-size:11px;padding:2px 4px"></select></span>
            </div>
            
            <table class="orderbook-table">
                <thead>
                    <tr>
                        <th id="thPrice">Price ($)</th>
                        <th id="thAmount">Amount</th>
                        <th id="thTotal">Total ($)</th>
                    </tr>
                </thead>
            </table>

            <!-- Satış Emri Tablosu -->
            <div class="scrollable-table-container" id="asksContainer">
                <table class="orderbook-table">
                    <tbody id="asksTable" class="asks"></tbody>
                </table>
            </div>

            <!-- Ortadaki Sabit Canlı Fiyat Bandı -->
            <div class="mid-price-bar">
                <div class="mid-price-val" id="midPrice">--</div>
                <div class="mid-price-sub" id="midPriceSpread">Spread: --</div>
            </div>

            <!-- Alış Emri Tablosu -->
            <div class="scrollable-table-container" id="bidsContainer">
                <table class="orderbook-table">
                    <tbody id="bidsTable" class="bids"></tbody>
                </table>
            </div>

            <!-- Alım/Satım Oran Çizelgesi -->
            <div class="ratio-container">
                <div class="ratio-labels">
                    <span class="ratio-buy-text" id="ratioBuyText">Buy %50.0</span>
                    <span class="ratio-sell-text" id="ratioSellText">%50.0 Sell</span>
                </div>
                <div class="ratio-bar-bg">
                    <div class="ratio-bar-fill" id="ratioBarFill"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <!-- MODAL: Coin Ekleme (ÇİFT BORSA DROPDOWN ARAMA) -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <span class="modal-close-x" onclick="closeModal('addModal')">✕</span>
            <h3 id="modalAddTitle">Add Pair to Watchlist</h3>
            <div class="form-group">
                <label id="lblCoinSymbol">Coin Symbol</label>
                <input type="text" id="newSymbolInput" placeholder="ADD pair (e.g. dogeusdt)..." autocomplete="off">
                <div id="searchResults" class="search-results-dropdown"></div>
            </div>
            <div class="modal-buttons">
                <button class="btn btn-close" onclick="closeModal('addModal')" id="btnCancel">Cancel</button>
            </div>
        </div>
    </div>

    <!-- MODAL: Alarm & Ayarlar -->
    <div class="modal" id="alarmModal">
        <div class="modal-content">
            <span class="modal-close-x" onclick="closeModal('alarmModal')">✕</span>
            <h3 id="alarmModalTitle">Settings & Alarm</h3>
            
            <div class="form-group">
                <label id="lblTargetPrice">1. Target Price Trigger ($)</label>
                <input type="number" id="alarmTargetPrice" step="any" placeholder="0.00">
            </div>
            
            <div class="form-group">
                <label id="lblWhaleVol">2. Whale Order Alarm (Min $ Volume)</label>
                <input type="number" id="alarmVolumeThreshold" step="10000" placeholder="250000">
            </div>

            <div class="form-group">
                <label id="lblAlarmType">Alarm Mode</label>
                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" name="alarmMode" value="once" checked> <span id="lblModeOnce">One-Time</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="alarmMode" value="persistent"> <span id="lblModePersistent">Persistent</span>
                    </label>
                </div>
            </div>

            <div class="active-alarms-box" id="activeAlarmsBox" style="display: none;">
                <div class="active-alarms-title" id="lblActiveAlarms">Active Alarms</div>
                <div id="activeAlarmsList"></div>
            </div>

            <div class="modal-buttons">
                <button class="btn btn-close" onclick="closeModal('alarmModal')" id="btnClose">Close</button>
                <button class="btn btn-add" onclick="saveAlarmSettings()" id="btnSaveAlarm">Save Alarm</button>
            </div>

            <button class="btn btn-tg" onclick="sendToTelegram()" id="btnTelegram">📲 Telegram'da 7/24 alarm kur</button>
            <div class="tg-hint" id="lblTgHint">Uygulama kapalıyken de bildirim gelir.</div>

            <span class="remove-coin-link" onclick="removeCurrentSymbol()" id="btnRemoveCoin">Remove this coin pair from list</span>
        </div>
    </div>

    <script>
        const i18n = {
            en: {
                mainList: "Main List",
                listPrefix: "List",
                liveBoard: "Live Order Book",
                depth: "Depth: 20x20",
                price: "Price ($)",
                amount: "Amount",
                total: "Total ($)",
                addModalTitle: "Add Pair to Watchlist",

        function playBeep() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, ctx.currentTime);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            } catch(e) {}
        }

        const USD_QUOTE = { COINBASE: 1, BITFINEX: 1 };
        function baseOf(sym) { return String(sym).toUpperCase().replace(/[-_/]/g, '').replace(/USDT$/, '').replace(/USD$/, ''); }

                case 'KUCOIN': case 'OKX': return b + '-USDT';
                case 'COINBASE': return b + '-USD';
                case 'BITFINEX': return 't' + (b.length > 3 ? b + ':USD' : b + 'USD');
                default: return b + 'USDT';

        async function kucoinSocketUrl() {
            const j = await (await fetch(KUCOIN_TOKEN_URL)).json();
            const s = j.data.instanceServers[0];
            return { url: `${s.endpoint}?token=${j.data.token}&connectId=${Date.now()}`, ping: s.pingInterval || 18000 };
        }
        function fmtPrice(p, dec) {
            if (dec == null) dec = p < 1 ? 6 : p < 100 ? 4 : 2;
            return p.toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec });
        }

        /* ===== FİYAT AKIŞLARI (tüm listeler + alarmlar) ===== */
        let tickerSockets = [];
        let tickerTimers = [];
        function onTick(ex, sym, price, change) {
            if (!isFinite(price)) return;
            const k = ik(ex, sym);
            const priceEl = document.getElementById(`price-${k}`);
            const changeEl = document.getElementById(`change-${k}`);
            if (priceEl) priceEl.innerText = fmtPrice(price);
            if (changeEl && isFinite(change)) {
                changeEl.innerText = `${change >= 0 ? '+' : ''}${change.toFixed(2)}%`;
                changeEl.className = `change ${change >= 0 ? 'up' : 'down'}`;
            }
            const a = alarms[k];
            if (a && a.targetPrice) {
                const target = a.targetPrice, prev = lastPrices[k];
                if (prev && ((prev < target && price >= target) || (prev > target && price <= target))) {
                    const msg = i18n[currentLang].toastPrice.replace('{sym}', keyLabel(k)).replace('{target}', target);
                    alarmNotify(msg, 'price-' + k);
                    if (a.mode === 'once') { delete a.targetPrice; renderGrid(); }
                }
            }
            lastPrices[k] = price;
        }
        function wantedTickers() {
            const m = {};
            const add = (ex, sym) => { ex = ex || 'BINANCE'; (m[ex] = m[ex] || new Set()).add(sym); };
            lists.forEach(l => l.symbols.forEach(i => add(i.exchange, i.symbol)));
            Object.keys(alarms).forEach(k => { if (alarms[k] && alarms[k].targetPrice) { const i = k.indexOf('-'); add(k.slice(0, i).toUpperCase(), k.slice(i + 1)); } });
            return m;
        }
        function connectTickerStream() {
            tickerSockets.forEach(w => { try { w.onclose = null; w.close(); } catch (e) {} });
            tickerTimers.forEach(clearInterval);
            tickerSockets = []; tickerTimers = [];
            const want = wantedTickers();
            Object.entries(want).forEach(([ex, set]) => { const syms = [...set]; if (syms.length) openTicker(ex, syms); });
        }
        function keepAlive(ws, fn, ms) { const t = setInterval(() => { if (ws.readyState === 1) fn(); }, ms); tickerTimers.push(t); }
        async function openTicker(ex, syms) {
            try {
                if (ex === 'BINANCE') {
                    const ws = new WebSocket(`wss://stream.binance.com:9443/stream?streams=${syms.map(s => exSym(ex, s).toLowerCase() + '@ticker').join('/')}`);
                    tickerSockets.push(ws);
                    ws.onmessage = e => { const d = JSON.parse(e.data).data; if (d && d.s) onTick(ex, d.s.toLowerCase(), +d.c, +d.P); };
                } else if (ex === 'OKX') {
                    const ws = new WebSocket('wss://ws.okx.com:8443/ws/v5/public');
                    tickerSockets.push(ws);
                    ws.onopen = () => ws.send(JSON.stringify({ op: 'subscribe', args: syms.map(s => ({ channel: 'tickers', instId: exSym(ex, s) })) }));
                    ws.onmessage = e => { if (e.data === 'pong') return; const j = JSON.parse(e.data); (j.data || []).forEach(d => onTick(ex, fromExSym(d.instId), +d.last, (d.last / d.open24h - 1) * 100)); };
                    keepAlive(ws, () => ws.send('ping'), 25000);
                } else if (ex === 'COINBASE') {
                    const ws = new WebSocket('wss://ws-feed.exchange.coinbase.com');
                    tickerSockets.push(ws);
                    ws.onopen = () => ws.send(JSON.stringify({ type: 'subscribe', product_ids: syms.map(s => exSym(ex, s)), channels: ['ticker'] }));
                    ws.onmessage = e => { const d = JSON.parse(e.data); if (d.type === 'ticker') onTick(ex, fromExSym(d.product_id), +d.price, (d.price / d.open_24h - 1) * 100); };
                } else if (ex === 'BITFINEX') {
                    const ws = new WebSocket('wss://api-pub.bitfinex.com/ws/2');
                    tickerSockets.push(ws);
                    const chans = {};
                    ws.onopen = () => syms.forEach(s => ws.send(JSON.stringify({ event: 'subscribe', channel: 'ticker', symbol: exSym(ex, s) })));
                    ws.onmessage = e => {
                        const d = JSON.parse(e.data);
                        if (d.event === 'subscribed') { chans[d.chanId] = fromExSym(d.symbol); return; }
                        if (Array.isArray(d) && Array.isArray(d[1]) && chans[d[0]]) onTick(ex, chans[d[0]], +d[1][6], d[1][5] * 100);
                    };
                } else if (ex === 'KUCOIN') {
                    const k = await kucoinSocketUrl();
                    const ws = new WebSocket(k.url);
                    tickerSockets.push(ws);
                    ws.onmessage = e => {
                        const j = JSON.parse(e.data);
                        if (j.type === 'welcome') ws.send(JSON.stringify({ id: Date.now(), type: 'subscribe', topic: '/market/snapshot:' + syms.map(s => exSym(ex, s)).join(','), response: true }));
                        else if (j.type === 'message' && j.data && j.data.data) { const d = j.data.data; onTick(ex, fromExSym(d.symbol), +d.lastTradedPrice, d.changeRate * 100); }
                    };
                    keepAlive(ws, () => ws.send(JSON.stringify({ id: Date.now(), type: 'ping' })), k.ping);
                }
            } catch (err) { console.warn('ticker', ex, err); }
        }

        /* ===== EMİR DEFTERİ (tam derinlik) ===== */
        let book = { bids: new Map(), asks: new Map() };
        let bookDirty = false, bookGen = 0, bookTimer = null;
        let groupStep = 0, groupAuto = true;
        const MAX_ROWS = 400;
        function resetBook() { book = { bids: new Map(), asks: new Map() }; bookDirty = true; }
        function applyLevels(side, levels) {
            const m = book[side];
            levels.forEach(l => { const p = +l[0], q = +l[1]; if (q === 0) m.delete(p); else m.set(p, q); });
            bookDirty = true;
        }
        function niceSteps(mid) {
            const out = [];
            for (let e = -8; e <= 5; e++) [1, 2, 5].forEach(m => { const s = m * Math.pow(10, e); if (s >= mid * 2e-6 && s <= mid * 0.02) out.push(+s.toPrecision(3)); });
            return out.slice(0, 7);
        }
        function updateGroupSelect(mid) {
            const sel = document.getElementById('obGroup');
            if (!sel || !mid) return;
            const steps = niceSteps(mid);
            const sig = steps.join(',');
            if (sel.dataset.sig !== sig) {
                sel.dataset.sig = sig;
                sel.innerHTML = steps.map(s => `<option value="${s}">${s}</option>`).join('');
                if (groupAuto || !steps.includes(groupStep)) groupStep = steps[Math.min(1, steps.length - 1)];
                sel.value = String(groupStep);
            }
        }
        function onGroupChange(v) { groupStep = +v; groupAuto = false; bookDirty = true; isInitialAsksScrollDone = false; }

        function connectDepthStream() {
            const gen = ++bookGen;
            if (depthWs) { try { depthWs.onclose = null; depthWs.close(); } catch (e) {} }
            if (bookTimer) clearInterval(bookTimer);
            resetBook();
            groupAuto = true;
            const sel = document.getElementById('obGroup'); if (sel) sel.dataset.sig = '';
            if (!selectedSymbol) return;
            const ex = selectedExchange, s = exSym(ex, selectedSymbol);
            bookTimer = setInterval(() => { if (bookDirty && gen === bookGen) { bookDirty = false; renderOrderBook(); } }, 400);
            const live = () => gen === bookGen;
            try {
                if (ex === 'BINANCE') {
                    let ready = false, lastId = 0, buf = [];
                    const ws = depthWs = new WebSocket(`wss://stream.binance.com:9443/ws/${s.toLowerCase()}@depth@100ms`);
                    const snap = async () => {
                        ready = false;
                        const j = await (await fetch(`https://api.binance.com/api/v3/depth?symbol=${s}&limit=5000`)).json();
                        if (!live()) return;
                        resetBook(); applyLevels('bids', j.bids); applyLevels('asks', j.asks); lastId = j.lastUpdateId;
                        buf.filter(ev => ev.u > lastId).forEach(ev => { applyLevels('bids', ev.b); applyLevels('asks', ev.a); lastId = ev.u; });
                        buf = []; ready = true;
                    };
                    ws.onopen = snap;
                    ws.onmessage = e => {
                        if (!live()) return;
                        const ev = JSON.parse(e.data);
                        if (!ready) { buf.push(ev); return; }
                        if (ev.u <= lastId) return;
                        if (ev.U > lastId + 1) { buf = [ev]; snap(); return; }
                        applyLevels('bids', ev.b); applyLevels('asks', ev.a); lastId = ev.u;
                    };
                } else if (ex === 'OKX') {
                    const ws = depthWs = new WebSocket('wss://ws.okx.com:8443/ws/v5/public');
                    ws.onopen = () => ws.send(JSON.stringify({ op: 'subscribe', args: [{ channel: 'books', instId: s }] }));
                    ws.onmessage = e => {
                        if (!live() || e.data === 'pong') return;
                        const j = JSON.parse(e.data); if (!j.data) return;
                        const d = j.data[0]; if (j.action === 'snapshot') resetBook();
                        applyLevels('bids', d.bids); applyLevels('asks', d.asks);
                    };
                    const t = setInterval(() => { if (!live()) return clearInterval(t); if (ws.readyState === 1) ws.send('ping'); }, 25000);
                } else if (ex === 'COINBASE') {
                    const ws = depthWs = new WebSocket('wss://ws-feed.exchange.coinbase.com');
                    ws.onopen = () => ws.send(JSON.stringify({ type: 'subscribe', product_ids: [s], channels: ['level2_batch'] }));
                    ws.onmessage = e => {
                        if (!live()) return;
                        const d = JSON.parse(e.data);
                        if (d.type === 'snapshot') { resetBook(); applyLevels('bids', d.bids); applyLevels('asks', d.asks); }
                        else if (d.type === 'l2update') d.changes.forEach(c => applyLevels(c[0] === 'buy' ? 'bids' : 'asks', [[c[1], c[2]]]));
                    };
                } else if (ex === 'BITFINEX') {
                    const ws = depthWs = new WebSocket('wss://api-pub.bitfinex.com/ws/2');
                    let chan = null;
                    const put = r => { const p = r[0], c = r[1], a = r[2]; const side = a > 0 ? 'bids' : 'asks'; if (c === 0) book[side].delete(p); else book[side].set(p, Math.abs(a)); bookDirty = true; };
                    ws.onopen = () => ws.send(JSON.stringify({ event: 'subscribe', channel: 'book', symbol: s, prec: 'P0', freq: 'F0', len: '250' }));
                    ws.onmessage = e => {
                        if (!live()) return;
                        const d = JSON.parse(e.data);
                        if (d.event === 'subscribed') { chan = d.chanId; return; }
                        if (!Array.isArray(d) || d[0] !== chan || d[1] === 'hb') return;
                        if (Array.isArray(d[1][0])) { resetBook(); d[1].forEach(put); } else put(d[1]);
                    };
                } else if (ex === 'KUCOIN') {
                    kucoinSocketUrl().then(k => {
                        if (!live()) return;
                        const ws = depthWs = new WebSocket(k.url);
                        ws.onmessage = e => {
                            if (!live()) return;
                            const j = JSON.parse(e.data);
                            if (j.type === 'welcome') ws.send(JSON.stringify({ id: Date.now(), type: 'subscribe', topic: '/spotMarket/level2Depth50:' + s, response: true }));
                            else if (j.type === 'message' && j.data) { resetBook(); applyLevels('bids', j.data.bids); applyLevels('asks', j.data.asks); }
                        };
                        const t = setInterval(() => { if (!live()) return clearInterval(t); if (ws.readyState === 1) ws.send(JSON.stringify({ id: Date.now(), type: 'ping' })); }, k.ping);
                    }).catch(err => console.warn('kucoin', err));
                }
            } catch (err) { console.warn('depth', ex, err); }
        }

        function groupSide(m, step, up) {
            const g = new Map();
            m.forEach((q, p) => { const gp = +((up ? Math.ceil(p / step - 1e-9) : Math.floor(p / step + 1e-9)) * step).toPrecision(12); g.set(gp, (g.get(gp) || 0) + q); });
            return g;
        }
        function renderOrderBook() {
            const asksTable = document.getElementById('asksTable');
            const bidsTable = document.getElementById('bidsTable');
            const asksContainer = document.getElementById('asksContainer');
            if (!book.asks.size && !book.bids.size) return;

            let bestAsk = Infinity, bestBid = 0;
            book.asks.forEach((q, p) => { if (p < bestAsk) bestAsk = p; });
            book.bids.forEach((q, p) => { if (p > bestBid) bestBid = p; });
            if (!isFinite(bestAsk)) bestAsk = bestBid;
            const mid = bestBid ? (bestAsk + bestBid) / 2 : bestAsk;
            updateGroupSelect(mid);
            const step = groupStep || niceSteps(mid)[0] || 0.01;
            const dec = Math.max(0, Math.min(8, -Math.floor(Math.log10(step) + 1e-9)));

            const askList = [...groupSide(book.asks, step, true)].sort((a, b) => a[0] - b[0]).slice(0, MAX_ROWS).map(([price, amount]) => ({ price, amount, total: price * amount }));
            const bidList = [...groupSide(book.bids, step, false)].sort((a, b) => b[0] - a[0]).slice(0, MAX_ROWS).map(([price, amount]) => ({ price, amount, total: price * amount }));

            const maxTotal = Math.max(1, ...askList.map(a => a.total), ...bidList.map(b => b.total));
            const row = (item, color) => {
                const pct = Math.min(100, item.total / maxTotal * 100).toFixed(1);
                const whale = alarms[selectedKey()] && alarms[selectedKey()].volumeThreshold && item.total >= alarms[selectedKey()].volumeThreshold;
                return `<tr style="background: linear-gradient(to left, ${color} ${pct}%, transparent ${pct}%);${whale ? 'outline:1px solid #f0b90b;' : ''}"><td class="price">${fmtPrice(item.price, dec)}</td><td>${item.amount < 10 ? item.amount.toFixed(4) : item.amount.toFixed(2)}</td><td>${Math.round(item.total).toLocaleString('en-US')}</td></tr>`;
            };
            asksTable.innerHTML = askList.slice().reverse().map(i => row(i, 'rgba(246, 70, 93, 0.4)')).join('');
            bidsTable.innerHTML = bidList.map(i => row(i, 'rgba(14, 203, 129, 0.4)')).join('');

            if (!isInitialAsksScrollDone && asksContainer) {
                setTimeout(() => { asksContainer.scrollTop = asksContainer.scrollHeight; isInitialAsksScrollDone = true; }, 50);
            }

            const t = i18n[currentLang];
            const depthEl = document.getElementById('lblDepth');
            if (depthEl) depthEl.innerText = `${t.depth.split(':')[0]}: ${book.bids.size.toLocaleString('en-US')}×${book.asks.size.toLocaleString('en-US')}`;

            const spread = Math.abs(bestAsk - bestBid);
            if (mid > 0) {
                document.getElementById('midPrice').innerText = fmtPrice(mid);
                document.getElementById('midPriceSpread').innerText = `Spread: ${spread < 1 ? spread.toFixed(4) : spread.toFixed(2)}`;
            }

            // Alış/satış oranı: orta fiyatın ±%2'si içindeki emirler
            let bidVol = 0, askVol = 0;
            book.bids.forEach((q, p) => { if (p >= mid * 0.98) bidVol += p * q; });
            book.asks.forEach((q, p) => { if (p <= mid * 1.02) askVol += p * q; });
            const buyRatio = bidVol + askVol > 0 ? bidVol / (bidVol + askVol) * 100 : 50;
            document.getElementById('ratioBuyText').innerText = `${t.buyText} %${buyRatio.toFixed(1)}`;
            document.getElementById('ratioSellText').innerText = `%${(100 - buyRatio).toFixed(1)} ${t.sellText}`;
            document.getElementById('ratioBarFill').style.width = `${buyRatio}%`;

            const k = selectedKey();
            if (alarms[k] && alarms[k].volumeThreshold) {
                const threshold = alarms[k].volumeThreshold, now = Date.now();
                const fresh = (side, item) => { const kk = k + side + item.price; if (whaleSeen[kk] && now - whaleSeen[kk] < 60000) return false; whaleSeen[kk] = now; return true; };
                askList.forEach(item => { if (item.total >= threshold && fresh('s', item)) alarmNotify(t.toastWhaleSell.replace('{sym}', keyLabel(k)).replace('{vol}', Math.round(item.total).toLocaleString('en-US')) + ' @ ' + fmtPrice(item.price, dec), 'whale-' + k); });
                bidList.forEach(item => { if (item.total >= threshold && fresh('b', item)) alarmNotify(t.toastWhaleBuy.replace('{sym}', keyLabel(k)).replace('{vol}', Math.round(item.total).toLocaleString('en-US')) + ' @ ' + fmtPrice(item.price, dec), 'whale-' + k); });
            }
        }
        function selectedKey() { return ik(selectedExchange, selectedSymbol); }

        /* ===== DETAY EKRANI (grafik + tahta) ===== */
        function openDetail(title) {
            document.getElementById('detailTitle').innerText = title;
            document.getElementById('detailView').classList.add('open');
            document.body.classList.add('detail-open');
            if (!history.state || !history.state.detail) history.pushState({ detail: 1 }, '');
            isInitialAsksScrollDone = false;
            setTimeout(renderTradingViewWidget, 50);
        }
        function closeDetail(fromPop) {
            const v = document.getElementById('detailView');
            if (!v.classList.contains('open')) return;
            v.classList.remove('open');
            document.body.classList.remove('detail-open');
            if (!fromPop && history.state && history.state.detail) history.back();
        }
        window.addEventListener('popstate', () => closeDetail(true));

        /* TRADINGVIEW GRAFİK YÜKLEYİCİ */
        function renderTradingViewWidget() {
            if (!selectedSymbol) return;
            const container = document.getElementById('tvChartContainer');
            container.innerHTML = ''; 

            const formattedSymbol = tvSymbol(selectedExchange, selectedSymbol);

            new TradingView.widget({
                "autosize": true,
                "symbol": formattedSymbol,
                "interval": "15",
                "timezone": "Etc/UTC",
                "theme": "dark",
                "style": "1",
                "locale": currentLang,
                "toolbar_bg": "#121418",
                "enable_publishing": false,
                "hide_side_toolbar": true,
                "allow_symbol_change": false,
                "container_id": "tvChartContainer"
            });
        }

        /* DİNAMİK CANLI ARAMA / BORSA FİLTRELEME MANTIĞI */
        const newSymbolInput = document.getElementById('newSymbolInput');
        const searchResults = document.getElementById('searchResults');

        /* BORSA PİYASA LİSTELERİ: sadece gerçekten listelenen pariteleri göster */
        const MKT_KEY = 'obtrader_markets_v1';
        const MARKETS = {};
        let marketsLoading = null;
        function loadMarkets() {
            if (marketsLoading) return marketsLoading;
            try {
                const c = JSON.parse(localStorage.getItem(MKT_KEY) || 'null');
                if (c && Date.now() - c.t < 6 * 3600e3) { for (const k in c.m) MARKETS[k] = new Set(c.m[k]); }
            } catch (e) {}
            const jobs = {
                BINANCE: async () => (await (await fetch('https://api.binance.com/api/v3/exchangeInfo?permissions=SPOT&symbolStatus=TRADING')).json()).symbols.filter(x => x.quoteAsset === 'USDT').map(x => x.baseAsset),
                OKX: async () => (await (await fetch('https://www.okx.com/api/v5/public/instruments?instType=SPOT')).json()).data.filter(x => x.quoteCcy === 'USDT' && x.state === 'live').map(x => x.baseCcy),
                COINBASE: async () => (await (await fetch('https://api.exchange.coinbase.com/products')).json()).filter(x => x.quote_currency === 'USD' && !x.trading_disabled && x.status === 'online').map(x => x.base_currency),
                KUCOIN: async () => (await (await fetch('https://cryptoverifly.com/api/markets.php?ex=kucoin')).json()),
                BITFINEX: async () => (await (await fetch('https://cryptoverifly.com/api/markets.php?ex=bitfinex')).json())
            };
            marketsLoading = Promise.all(Object.entries(jobs).map(async ([ex, f]) => {
                if (MARKETS[ex] && MARKETS[ex].size) return;
                try { const arr = await f(); if (arr && arr.length) MARKETS[ex] = new Set(arr.map(b => String(b).toUpperCase())); } catch (e) {}
            })).then(() => {
                try { const m = {}; for (const k in MARKETS) m[k] = [...MARKETS[k]]; localStorage.setItem(MKT_KEY, JSON.stringify({ t: Date.now(), m })); } catch (e) {}
                marketsLoading = null;
            });
            return marketsLoading;
        }
        // Bitfinex listesi alınamazsa tek tek canlı kontrol
        const bfxCache = {};
        function bitfinexHas(base) {
            if (MARKETS.BITFINEX) return Promise.resolve(MARKETS.BITFINEX.has(base));
            if (base in bfxCache) return Promise.resolve(bfxCache[base]);
            return new Promise(res => {
                let done = false; const fin = v => { if (done) return; done = true; bfxCache[base] = v; try { ws.close(); } catch (e) {} res(v); };
                const ws = new WebSocket('wss://api-pub.bitfinex.com/ws/2');
                ws.onopen = () => ws.send(JSON.stringify({ event: 'subscribe', channel: 'ticker', symbol: exSym('BITFINEX', base) }));
                ws.onmessage = e => { const d = JSON.parse(e.data); if (d.event === 'subscribed') fin(true); else if (d.event === 'error') fin(false); };
                ws.onerror = () => fin(false);
                setTimeout(() => fin(false), 4000);
            });
        }

        let searchSeq = 0;
        newSymbolInput.addEventListener('focus', loadMarkets);
        newSymbolInput.addEventListener('input', async function(e) {
            const seq = ++searchSeq;
            const query = baseOf(e.target.value.trim().toUpperCase().replace(/[^A-Z0-9]/g, ''));
            searchResults.innerHTML = '';
            if (!query) { searchResults.classList.remove('active'); return; }
            searchResults.innerHTML = `<div class="no-result-item">…</div>`;
            searchResults.classList.add('active');
            await loadMarkets();
            if (seq !== searchSeq) return;

            // Eşleşen coinler: önce tam eşleşme, sonra baştan eşleşenler
            const all = new Set();
            Object.values(MARKETS).forEach(set => set.forEach(b => { if (b.startsWith(query)) all.add(b); }));
            all.add(query);
            const bases = [...all].sort((a, b) => (a === query ? -1 : b === query ? 1 : a.length - b.length || a.localeCompare(b))).slice(0, 8);

            const results = [];
            for (const b of bases) {
                for (const ex of supportedExchanges) {
                    let ok = MARKETS[ex] ? MARKETS[ex].has(b) : false;
                    if (ex === 'BITFINEX' && !MARKETS.BITFINEX && b === query) ok = await bitfinexHas(b);
                    if (ok) results.push({ rawSymbol: b.toLowerCase() + 'usdt', displayName: pairName(b, ex), exchange: ex });
                }
            }
            if (seq !== searchSeq) return;
            searchResults.innerHTML = '';
            if (results.length === 0) {
                searchResults.innerHTML = `<div class="no-result-item">${i18n[currentLang].notFound}</div>`;
            } else {
                results.slice(0, 40).forEach(res => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'search-item';
                    itemDiv.innerHTML = `<span>${res.displayName}</span><span class="search-exchange-tag">${res.exchange}</span>`;
                    itemDiv.onclick = () => addSelectedPair(res.rawSymbol, res.displayName, res.exchange);
                    searchResults.appendChild(itemDiv);
                });
            }
            searchResults.classList.add('active');
        });

        function addSelectedPair(rawSymbol, displayName, exchange) {
            const currentList = getCurrentList();
            
            // Eğer aynı coin ve borsa kombinasyonu daha önce eklenmemişse ekle
            if (!currentList.symbols.some(s => s.symbol === rawSymbol && s.exchange === exchange)) {
                currentList.symbols.push({
                    symbol: rawSymbol,
                    name: displayName,
                    exchange: exchange
                });
                renderGrid();
                selectSymbol(rawSymbol, displayName, exchange);
            }

            newSymbolInput.value = '';
            searchResults.classList.remove('active');
            closeModal('addModal');
        }

        function openAddModal() {
            document.getElementById('addModal').style.display = 'flex';
            document.getElementById('newSymbolInput').focus();
        }

        function openAlarmModal(sym, name) {
            targetAlarmSymbol = sym;
            const modal = document.getElementById('alarmModal');
            document.getElementById('alarmModalTitle').innerText = `${name} - ${i18n[currentLang].settingsAlarm}`;
            
            const conf = alarms[sym] || {};
            document.getElementById('alarmTargetPrice').value = conf.targetPrice || '';
            document.getElementById('alarmVolumeThreshold').value = conf.volumeThreshold || '';
            const modeEl = document.querySelector(`input[name="alarmMode"][value="${conf.mode || 'once'}"]`);
            if (modeEl) modeEl.checked = true;

            renderActiveAlarmsList(sym);
            modal.style.display = 'flex';
        }

        function renderActiveAlarmsList(sym) {
            const box = document.getElementById('activeAlarmsBox');
            const list = document.getElementById('activeAlarmsList');
            const conf = alarms[sym];

            if (conf && (conf.targetPrice || conf.volumeThreshold)) {
                box.style.display = 'block';
                list.innerHTML = '';
                const t = i18n[currentLang];

                if(conf.targetPrice) {
                    list.innerHTML += `
                        <div class="alarm-item">
                            <span>🎯 ${t.alarmTargetText}: $${conf.targetPrice}</span>
                            <span class="alarm-delete" onclick="clearAlarmProp('${sym}', 'targetPrice')">✕</span>
                        </div>
                    `;
                }
                if(conf.volumeThreshold) {
                    list.innerHTML += `
                        <div class="alarm-item">
                            <span>🐋 ${t.alarmVolText}: $${conf.volumeThreshold.toLocaleString()}</span>
                            <span class="alarm-delete" onclick="clearAlarmProp('${sym}', 'volumeThreshold')">✕</span>
                        </div>
                    `;
                }
            } else {
                box.style.display = 'none';
            }
        }

        function clearAlarmProp(sym, prop) {
            if (alarms[sym]) {
                delete alarms[sym][prop];
                renderActiveAlarmsList(sym);
                renderGrid();
            }
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
            if (modalId === 'addModal') {
                document.getElementById('newSymbolInput').value = '';
                document.getElementById('searchResults').classList.remove('active');
            }
        }

        function saveAlarmSettings() {
            const targetPrice = parseFloat(document.getElementById('alarmTargetPrice').value);
            const volumeThreshold = parseFloat(document.getElementById('alarmVolumeThreshold').value);
            const mode = document.querySelector('input[name="alarmMode"]:checked').value;

            if (targetAlarmSymbol) {
                alarms[targetAlarmSymbol] = {
                    targetPrice: targetPrice || null,
                    volumeThreshold: volumeThreshold || null,
                    mode: mode
                };
                
                askNotifyPermission();
                const msg = i18n[currentLang].toastSaved.replace('{sym}', keyLabel(targetAlarmSymbol));
                showToast(msg);
                renderGrid();
            }

            closeModal('alarmModal');
        }

        /* ===== TELEGRAM 7/24 ALARM ===== */
        const TG_BOT = 'ObTraderAlarmBot';
        function sendToTelegram() {
            const t = i18n[currentLang];
            const key = targetAlarmSymbol;
            if (!key) return;
            const price = parseFloat(document.getElementById('alarmTargetPrice').value) || 0;
            const whale = parseFloat(document.getElementById('alarmVolumeThreshold').value) || 0;
            if (!price && !whale) { showToast(t.tgNeed || i18n.en.tgNeed); return; }
            const i = key.indexOf('-'), ex = key.slice(0, i), base = baseOf(key.slice(i + 1));
            const botEx = ['binance', 'okx', 'coinbase'].includes(ex) ? ex : 'binance';
            const cur = lastPrices[key];
            const op = (cur && price && price < cur) ? 'l' : 'g';
            const n = v => String(+v.toFixed(8)).replace('.', 'd');
            const payload = `${botEx}_${base}_${op}_${n(price)}_${n(whale)}`.slice(0, 64);
            saveAlarmSettings();
            window.open(`https://t.me/${TG_BOT}?start=${payload}`, '_blank');
        }

        function removeCurrentSymbol() {
            if (!targetAlarmSymbol) return;

            const currentList = getCurrentList();
            currentList.symbols = currentList.symbols.filter(s => ik(s.exchange, s.symbol) !== targetAlarmSymbol);
            
            delete alarms[targetAlarmSymbol];

            const msg = i18n[currentLang].toastRemoved.replace('{sym}', keyLabel(targetAlarmSymbol));
            showToast(msg);

            closeModal('alarmModal');

            if (currentList.symbols.length > 0) {
                selectSymbol(currentList.symbols[0].symbol, currentList.symbols[0].name, currentList.symbols[0].exchange || 'BINANCE');
            } else {
                selectedSymbol = '';
                updateLiveBoardTitle('---');
            }

            renderGrid();
        }

        // Tıklama arama alanının dışındaysa dropdown'ı kapat
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.form-group')) {
                searchResults.classList.remove('active');
            }
        });

        // Başlangıç Kurulumları
        changeLanguage(currentLang);
        (function initBoard() {
            const cur = getCurrentList() || lists[0];
            const it = cur && (cur.symbols.find(s => s.symbol === selectedSymbol) || cur.symbols[0]);
            if (it) selectSymbol(it.symbol, it.name, it.exchange || 'BINANCE');
        })();
        // Telefon uykudan / sekme arka plandan dönünce bağlantıları tazele
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) return;
            if (!tickerSockets.length || tickerSockets.some(w => w.readyState > 1)) connectTickerStream();
            if (selectedSymbol && (!depthWs || depthWs.readyState > 1)) connectDepthStream();
        });
        window.addEventListener('online', () => { connectTickerStream(); if (selectedSymbol) connectDepthStream(); });
    </script>
</body>
</html>
