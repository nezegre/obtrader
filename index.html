<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ObTrader - TabTrader View</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #000000; color: #eaecef; padding: 10px; -webkit-user-select: none; }
        
        .app-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 5px; border-bottom: 1px solid #1e2329; margin-bottom: 10px; }
        .app-title { font-size: 18px; font-weight: bold; color: #fff; display: flex; align-items: center; gap: 8px; }
        .app-title span { color: #16f7d1; font-size: 10px; background: rgba(22, 247, 209, 0.15); padding: 2px 6px; border-radius: 4px; }

        .lang-select {
            background: #121418;
            color: #16f7d1;
            border: 1px solid rgba(22, 247, 209, 0.3);
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 11px;
            font-weight: bold;
            outline: none;
            cursor: pointer;
        }

        .tabs-container { display: flex; align-items: center; border-bottom: 1px solid #1e2329; margin-bottom: 12px; gap: 8px; overflow-x: auto; }
        .tabs { display: flex; gap: 12px; font-size: 13px; color: #848e9c; }
        .tab { padding: 6px 10px; cursor: pointer; white-space: nowrap; border-bottom: 2px solid transparent; transition: all 0.2s; }
        .tab.active { color: #fff; font-weight: bold; border-bottom-color: #16f7d1; }
        
        .btn-add-tab { 
            background: rgba(22, 247, 209, 0.1); 
            color: #16f7d1; 
            border: 1px solid rgba(22, 247, 209, 0.3); 
            width: 24px; 
            height: 24px; 
            border-radius: 4px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: bold;
            margin-bottom: 4px;
            flex-shrink: 0;
        }

        .watch-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 8px; 
            margin-bottom: 15px; 
        }

        @media (min-width: 768px) {
            .watch-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
        }

        .card { 
            background: #121418; 
            border: 1px solid #1e2329; 
            border-radius: 8px; 
            padding: 10px; 
            position: relative; 
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 90px;
        }
        .card.active { border-color: #16f7d1; }
        
        .card-header { display: flex; justify-content: space-between; align-items: center; }
        .symbol-name { font-size: 13px; font-weight: 700; color: #fff; }
        .header-right { display: flex; align-items: center; gap: 6px; }
        .change { font-size: 11px; font-weight: 600; }
        
        .up { color: #0ecb81; }
        .down { color: #f6465d; }

        .more-btn { 
            color: #848e9c; 
            font-size: 16px; 
            padding: 0 4px; 
            cursor: pointer; 
            line-height: 1;
            position: relative;
        }
        .has-alarm::after {
            content: '';
            position: absolute;
            top: 2px;
            right: 2px;
            width: 5px;
            height: 5px;
            background-color: #16f7d1;
            border-radius: 50%;
        }

        .card-body { display: flex; justify-content: center; align-items: center; flex-grow: 1; }
        .price { font-size: 16px; font-weight: 700; font-family: monospace; color: #fff; text-align: center; }

        .card-add-box {
            background: #0a0c0e;
            border: 1px dashed #2b313a;
            border-radius: 8px;
            height: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        .card-add-icon { font-size: 28px; color: #16f7d1; font-weight: 300; }

        /* YENİ GELİŞTİRİLMİŞ CANLI EMİR TAHTASI */
        .ob-drawer { background: #121418; border: 1px solid #1e2329; padding: 12px; border-radius: 8px; margin-top: 10px; }
        .ob-header { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 13px; font-weight: bold; color: #16f7d1; }
        
        .orderbook-container {
            max-height: 380px;
            overflow-y: auto;
            position: relative;
        }
        
        /* Custom Scrollbar */
        .orderbook-container::-webkit-scrollbar { width: 4px; }
        .orderbook-container::-webkit-scrollbar-thumb { background: #2b313a; border-radius: 2px; }

        .orderbook-table { width: 100%; border-collapse: collapse; font-family: monospace; font-size: 12px; }
        .orderbook-table th { color: #848e9c; font-weight: normal; padding-bottom: 6px; border-bottom: 1px solid #2b313a; position: sticky; top: 0; background: #121418; z-index: 2; }
        .orderbook-table tr { height: 22px; position: relative; }
        .orderbook-table td { padding: 2px 4px; text-align: right; position: relative; z-index: 1; }
        
        .asks td.price-cell { color: #f6465d; text-align: left; font-weight: bold; }
        .bids td.price-cell { color: #0ecb81; text-align: left; font-weight: bold; }

        /* Arkaplan Hacim Çubuğu (Görseldeki gibi kademeli renk) */
        .depth-bar {
            position: absolute;
            top: 0;
            right: 0;
            height: 100%;
            z-index: 0;
            opacity: 0.25;
            transition: width 0.1s linear;
        }
        .asks .depth-bar { background-color: #f6465d; }
        .bids .depth-bar { background-color: #0ecb81; }

        /* Orta Anlık Fiyat Şeridi */
        .mid-price-bar {
            text-align: center;
            padding: 8px 0;
            background: #0a0c0e;
            border-top: 1px solid #1e2329;
            border-bottom: 1px solid #1e2329;
            margin: 4px 0;
        }
        .mid-price { font-size: 18px; font-weight: bold; color: #fff; font-family: monospace; }
        .mid-subtext { font-size: 11px; color: #848e9c; margin-top: 2px; }

        /* En Alttaki Alım / Satım Oran Çubuğu */
        .ratio-container { margin-top: 10px; padding-top: 8px; border-top: 1px solid #1e2329; }
        .ratio-labels { display: flex; justify-content: space-between; font-size: 11px; font-weight: bold; margin-bottom: 4px; font-family: monospace; }
        .ratio-buy-text { color: #0ecb81; }
        .ratio-sell-text { color: #f6465d; }
        .ratio-bar-bg { height: 6px; width: 100%; background: #2b313a; border-radius: 3px; display: flex; overflow: hidden; }
        .ratio-bar-buy { height: 100%; background: #0ecb81; transition: width 0.2s ease; }
        .ratio-bar-sell { height: 100%; background: #f6465d; transition: width 0.2s ease; }

        /* MODAL YAPISI */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 100; padding: 15px; }
        .modal-content { background: #121418; padding: 20px; border-radius: 8px; width: 100%; max-width: 400px; border: 1px solid #2b313a; position: relative; }
        
        .modal-close-x { position: absolute; top: 12px; right: 15px; color: #848e9c; font-size: 18px; cursor: pointer; font-weight: bold; }
        .modal-content h3 { margin-bottom: 15px; color: #fff; font-size: 15px; border-bottom: 1px solid #2b313a; padding-bottom: 8px; padding-right: 25px; }
        
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 11px; color: #848e9c; margin-bottom: 4px; }
        .form-group input[type="text"], .form-group input[type="number"] { width: 100%; padding: 10px; background: #1a1d24; border: 1px solid #363c4e; color: #fff; border-radius: 4px; font-size: 13px; outline: none; }
        
        .radio-group { display: flex; gap: 15px; margin-top: 6px; }
        .radio-option { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #eaecef; cursor: pointer; }
        .radio-option input { accent-color: #16f7d1; }

        .active-alarms-box { background: #000000; border: 1px solid #2b313a; border-radius: 4px; padding: 8px; margin-top: 10px; }
        .active-alarms-title { font-size: 11px; color: #16f7d1; font-weight: bold; margin-bottom: 6px; }
        .alarm-item { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: #eaecef; background: #1a1d24; padding: 5px 8px; border-radius: 3px; margin-bottom: 4px; }
        .alarm-delete { color: #f6465d; cursor: pointer; font-weight: bold; }

        .modal-buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 15px; }
        .btn { padding: 10px 16px; border-radius: 4px; border: none; font-weight: bold; cursor: pointer; font-size: 12px; }
        .btn-add { background: #16f7d1; color: #000000; }
        .btn-close { background: #363c4e; color: #fff; }

        .remove-coin-link { display: block; text-align: center; color: #f6465d; font-size: 11px; margin-top: 15px; cursor: pointer; text-decoration: underline; }

        .toast-container { position: fixed; bottom: 20px; left: 15px; right: 15px; z-index: 200; pointer-events: none; }
        .toast { background: #16f7d1; color: #000000; padding: 12px 16px; border-radius: 6px; font-weight: bold; font-size: 12px; margin-top: 8px; box-shadow: 0 4px 12px rgba(22, 247, 209, 0.3); animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body>

    <div class="app-bar">
        <div class="app-title">OBTRADER <span>ULTRA</span></div>
        <select class="lang-select" id="langSelect" onchange="changeLanguage(this.value)">
            <option value="en">EN 🇺🇸</option>
            <option value="zh">ZH 🇨🇳</option>
            <option value="tr" selected>TR 🇹🇷</option>
            <option value="de">DE 🇩🇪</option>
            <option value="ko">KO 🇰🇷</option>
            <option value="es">ES 🇪🇸</option>
            <option value="ar">AR 🇸🇦</option>
            <option value="fr">FR 🇫🇷</option>
        </select>
    </div>

    <div class="tabs-container">
        <div class="tabs" id="tabList"></div>
        <button class="btn-add-tab" onclick="createNewTab()" id="btnNewTabTitle" title="Yeni Liste">＋</button>
    </div>

    <div class="watch-grid" id="watchGrid"></div>

    <!-- DERİNLİK TAHTASI VE ORAN ÇUBUĞU -->
    <div class="ob-drawer">
        <div class="ob-header">
            <span id="activeSymbolTitle">BTC/USDT</span>
            <span style="color: #848e9c; font-size: 11px;" id="lblDepth">Derinlik: 50x50</span>
        </div>
        
        <div class="orderbook-container" id="obScrollContainer">
            <table class="orderbook-table">
                <thead>
                    <tr>
                        <th style="text-align: left;" id="thPrice">Fiyat ($)</th>
                        <th id="thAmount">Miktar</th>
                        <th id="thTotal">Toplam ($)</th>
                    </tr>
                </thead>
                <tbody id="asksTable"></tbody>
            </table>

            <div class="mid-price-bar">
                <div class="mid-price" id="midPrice">0.00</div>
                <div class="mid-subtext" id="midSubText">≈ $0.00</div>
            </div>

            <table class="orderbook-table">
                <tbody id="bidsTable"></tbody>
            </table>
        </div>

        <!-- ALIM / SATIM DENGESİ ORANI -->
        <div class="ratio-container">
            <div class="ratio-labels">
                <span class="ratio-buy-text" id="buyRatioText">%50.00</span>
                <span class="ratio-sell-text" id="sellRatioText">%50.00</span>
            </div>
            <div class="ratio-bar-bg">
                <div class="ratio-bar-buy" id="buyRatioBar" style="width: 50%;"></div>
                <div class="ratio-bar-sell" id="sellRatioBar" style="width: 50%;"></div>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <!-- MODAL: Coin Ekleme -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <span class="modal-close-x" onclick="closeModal('addModal')">✕</span>
            <h3 id="modalAddTitle">İzleme Listesine Parite Ekle</h3>
            <div class="form-group">
                <label id="lblCoinSymbol">Coin Sembolü</label>
                <input type="text" id="newSymbolInput" placeholder="Örn: solusdt veya dogeusdt">
            </div>
            <div class="modal-buttons">
                <button class="btn btn-close" onclick="closeModal('addModal')" id="btnCancel">İptal</button>
                <button class="btn btn-add" onclick="addNewSymbol()" id="btnAdd">Ekle</button>
            </div>
        </div>
    </div>

    <!-- MODAL: Alarm & Ayarlar -->
    <div class="modal" id="alarmModal">
        <div class="modal-content">
            <span class="modal-close-x" onclick="closeModal('alarmModal')">✕</span>
            <h3 id="alarmModalTitle">Coin Ayarları & Alarm</h3>
            
            <div class="form-group">
                <label id="lblTargetPrice">1. Hedef Fiyat Tetiklemesi ($)</label>
                <input type="number" id="alarmTargetPrice" step="any" placeholder="0.00">
            </div>
            
            <div class="form-group">
                <label id="lblWhaleVol">2. Tahta Balina Emri Alarmı (Min $ Hacim)</label>
                <input type="number" id="alarmVolumeThreshold" step="10000" placeholder="250000">
            </div>

            <div class="form-group">
                <label id="lblAlarmType">Alarm Çalışma Tipi</label>
                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" name="alarmMode" value="once" checked> <span id="lblModeOnce">Tek Seferlik</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="alarmMode" value="persistent"> <span id="lblModePersistent">Sürekli</span>
                    </label>
                </div>
            </div>

            <div class="active-alarms-box" id="activeAlarmsBox" style="display: none;">
                <div class="active-alarms-title" id="lblActiveAlarms">Aktif Alarmlar</div>
                <div id="activeAlarmsList"></div>
            </div>

            <div class="modal-buttons">
                <button class="btn btn-close" onclick="closeModal('alarmModal')" id="btnClose">Kapat</button>
                <button class="btn btn-add" onclick="saveAlarmSettings()" id="btnSaveAlarm">Alarmı Kaydet</button>
            </div>

            <span class="remove-coin-link" onclick="removeCurrentSymbol()" id="btnRemoveCoin">Bu coin çiftini listeden kaldır</span>
        </div>
    </div>

    <script>
        const i18n = {
            en: {
                mainList: "Main List", listPrefix: "List", liveBoard: "Live Order Book", depth: "Depth: 50x50",
                price: "Price ($)", amount: "Amount", total: "Total ($)", addModalTitle: "Add Pair to Watchlist",
                coinSymbol: "Coin Symbol", symbolPlaceholder: "e.g. solusdt or dogeusdt", cancel: "Cancel", add: "Add",
                settingsAlarm: "Settings & Alarm", targetPrice: "1. Target Price Trigger ($)", whaleVol: "2. Whale Order Alarm (Min $ Volume)",
                alarmType: "Alarm Mode", once: "One-Time", persistent: "Persistent", activeAlarms: "Active Alarms",
                close: "Close", saveAlarm: "Save Alarm", removeCoin: "Remove this coin pair from list",
                alarmTargetText: "Target Price", alarmVolText: "Min Volume",
                toastPrice: "🔔 ALARM: {sym} reached target price ${target}!",
                toastWhaleSell: "🚨 WHALE ORDER: ${vol} SELL wall on {sym}!",
                toastWhaleBuy: "🚨 WHALE ORDER: ${vol} BUY wall on {sym}!",
                toastRemoved: "{sym} removed from list.", toastSaved: "Alarm saved for {sym}."
            },
            tr: {
                mainList: "Ana Listem", listPrefix: "Liste", liveBoard: "Canlı Tahta", depth: "Derinlik: 50x50",
                price: "Fiyat ($)", amount: "Miktar", total: "Toplam ($)", addModalTitle: "İzleme Listesine Parite Ekle",
                coinSymbol: "Coin Sembolü", symbolPlaceholder: "Örn: solusdt veya dogeusdt", cancel: "İptal", add: "Ekle",
                settingsAlarm: "Ayarlar & Alarm", targetPrice: "1. Hedef Fiyat Tetiklemesi ($)", whaleVol: "2. Tahta Balina Emri Alarmı (Min $ Hacim)",
                alarmType: "Alarm Çalışma Tipi", once: "Tek Seferlik", persistent: "Sürekli", activeAlarms: "Aktif Alarmlar",
                close: "Kapat", saveAlarm: "Alarmı Kaydet", removeCoin: "Bu coin çiftini listeden kaldır",
                alarmTargetText: "Hedef Fiyat", alarmVolText: "Min Hacim",
                toastPrice: "🔔 ALARM: {sym} hedeflenen {target} $ seviyesine ulaştı!",
                toastWhaleSell: "🚨 BALİNA EMRİ: {sym} tahtasında ${vol} SATIM duvarı belirdi!",
                toastWhaleBuy: "🚨 BALİNA EMRİ: {sym} tahtasında ${vol} ALIM duvarı belirdi!",
                toastRemoved: "{sym} listeden kaldırıldı.", toastSaved: "{sym} için alarm kaydedildi."
            }
        };

        let currentLang = 'tr';
        let lists = [
            {
                id: 'main', titleKey: 'mainList', title: i18n['tr'].mainList,
                symbols: [ { symbol: 'btcusdt', name: 'BTC/USDT' }, { symbol: 'ethusdt', name: 'ETH/USDT' } ]
            }
        ];

        let activeListId = 'main';
        let selectedSymbol = 'btcusdt';
        let targetAlarmSymbol = '';
        let tickerWs, depthWs;
        let alarms = {};
        let triggeredAlarms = new Set();

        function changeLanguage(lang) {
            currentLang = lang;
            const t = i18n[lang] || i18n['en'];
            document.getElementById('lblDepth').innerText = t.depth;
            document.getElementById('thPrice').innerText = t.price;
            document.getElementById('thAmount').innerText = t.amount;
            document.getElementById('thTotal').innerText = t.total;
            document.getElementById('modalAddTitle').innerText = t.addModalTitle;
            document.getElementById('lblCoinSymbol').innerText = t.coinSymbol;
            document.getElementById('newSymbolInput').placeholder = t.symbolPlaceholder;
            document.getElementById('btnCancel').innerText = t.cancel;
            document.getElementById('btnAdd').innerText = t.add;
            document.getElementById('lblTargetPrice').innerText = t.targetPrice;
            document.getElementById('lblWhaleVol').innerText = t.whaleVol;
            document.getElementById('lblAlarmType').innerText = t.alarmType;
            document.getElementById('lblModeOnce').innerText = t.once;
            document.getElementById('lblModePersistent').innerText = t.persistent;
            document.getElementById('lblActiveAlarms').innerText = t.activeAlarms;
            document.getElementById('btnClose').innerText = t.close;
            document.getElementById('btnSaveAlarm').innerText = t.saveAlarm;
            document.getElementById('btnRemoveCoin').innerText = t.removeCoin;

            renderTabs();
            renderGrid();
            updateLiveBoardTitle();
        }

        function playBeep() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(880, ctx.currentTime);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(); osc.stop(ctx.currentTime + 0.3);
            } catch(e) {}
        }

        function showToast(msg) {
            playBeep();
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast'; toast.innerText = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        function renderTabs() {
            const tabList = document.getElementById('tabList');
            tabList.innerHTML = '';
            lists.forEach(l => {
                const tab = document.createElement('div');
                tab.className = `tab ${l.id === activeListId ? 'active' : ''}`;
                tab.innerText = l.title;
                tab.onclick = () => switchTab(l.id);
                tabList.appendChild(tab);
            });
        }

        function createNewTab() {
            const newId = 'list_' + Date.now();
            const t = i18n[currentLang] || i18n['en'];
            lists.push({ id: newId, title: `${t.listPrefix} ${lists.length + 1}`, symbols: [{ symbol: 'btcusdt', name: 'BTC/USDT' }] });
            switchTab(newId);
        }

        function switchTab(listId) {
            activeListId = listId;
            renderTabs();
            const currentList = getCurrentList();
            if (currentList.symbols.length > 0) {
                selectedSymbol = currentList.symbols[0].symbol;
                selectSymbol(selectedSymbol, currentList.symbols[0].name);
            } else { selectedSymbol = ''; }
            renderGrid();
        }

        function getCurrentList() { return lists.find(l => l.id === activeListId); }

        function renderGrid() {
            const grid = document.getElementById('watchGrid');
            grid.innerHTML = '';
            const currentList = getCurrentList();

            currentList.symbols.forEach(item => {
                const card = document.createElement('div');
                card.className = `card ${item.symbol === selectedSymbol ? 'active' : ''}`;
                card.id = `card-${item.symbol}`;
                card.onclick = (e) => { if(!e.target.classList.contains('more-btn')) selectSymbol(item.symbol, item.name); };

                const hasAlarm = alarms[item.symbol] && (alarms[item.symbol].targetPrice || alarms[item.symbol].volumeThreshold);

                card.innerHTML = `
                    <div class="card-header">
                        <div class="symbol-name">${item.name}</div>
                        <div class="header-right">
                            <div class="change" id="change-${item.symbol}">%0.00</div>
                            <div class="more-btn ${hasAlarm ? 'has-alarm' : ''}" onclick="openAlarmModal('${item.symbol}', '${item.name}')">⋮</div>
                        </div>
                    </div>
                    <div class="card-body"><div class="price" id="price-${item.symbol}">--</div></div>
                `;
                grid.appendChild(card);
            });

            const addCard = document.createElement('div');
            addCard.className = 'card-add-box';
            addCard.onclick = openAddModal;
            addCard.innerHTML = `<div class="card-add-icon">＋</div>`;
            grid.appendChild(addCard);

            connectTickerStream();
        }

        function connectTickerStream() {
            if (tickerWs) tickerWs.close();
            const currentList = getCurrentList();
            if (!currentList || currentList.symbols.length === 0) return;

            const streams = currentList.symbols.map(i => `${i.symbol}@ticker`).join('/');
            tickerWs = new WebSocket(`wss://stream.binance.com:9443/ws/${streams}`);

            tickerWs.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.s) {
                    const sym = data.s.toLowerCase();
                    const price = parseFloat(data.c);
                    const change = parseFloat(data.P);

                    const priceEl = document.getElementById(`price-${sym}`);
                    const changeEl = document.getElementById(`change-${sym}`);

                    if (priceEl && changeEl) {
                        priceEl.innerText = price < 1 ? price.toFixed(6) : price.toLocaleString('tr-TR', {minimumFractionDigits: 2});
                        changeEl.innerText = `${change >= 0 ? '+' : ''}${change.toFixed(2)}%`;
                        changeEl.className = `change ${change >= 0 ? 'up' : 'down'}`;

                        if (sym === selectedSymbol) {
                            document.getElementById('midPrice').innerText = price < 1 ? price.toFixed(6) : price.toFixed(2);
                            document.getElementById('midSubText').innerText = `≈ $${price < 1 ? price.toFixed(6) : price.toFixed(2)}`;
                        }

                        if (alarms[sym] && alarms[sym].targetPrice) {
                            const target = alarms[sym].targetPrice;
                            const mode = alarms[sym].mode || 'once';
                            const key = `${sym}-price-${target}`;
                            
                            if (!triggeredAlarms.has(key) && Math.abs(price - target) / target < 0.002) {
                                triggeredAlarms.add(key);
                                const t = i18n[currentLang] || i18n['en'];
                                showToast(t.toastPrice.replace('{sym}', sym.toUpperCase()).replace('{target}', target));
                                if (mode === 'once') { delete alarms[sym].targetPrice; renderGrid(); }
                            }
                        }
                    }
                }
            };
        }

        function updateLiveBoardTitle() {
            const currentList = getCurrentList();
            const item = currentList ? currentList.symbols.find(s => s.symbol === selectedSymbol) : null;
            const name = item ? item.name : 'BTC/USDT';
            const t = i18n[currentLang] || i18n['en'];
            document.getElementById('activeSymbolTitle').innerText = `${name} ${t.liveBoard}`;
        }

        function selectSymbol(symbol, name) {
            selectedSymbol = symbol;
            document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
            const activeCard = document.getElementById(`card-${symbol}`);
            if (activeCard) activeCard.classList.add('active');
            
            updateLiveBoardTitle();
            connectDepthStream();
        }

        function connectDepthStream() {
            if (depthWs) depthWs.close();
            if (!selectedSymbol) return;

            // 50 Derinlik Verisi Çekilir
            depthWs = new WebSocket(`wss://stream.binance.com:9443/ws/${selectedSymbol}@depth20@100ms`);

            depthWs.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.bids && data.asks) renderOrderBook(data.bids, data.asks);
            };
        }

        function formatQuantity(qty) {
            if (qty >= 1000) return (qty / 1000).toFixed(2) + 'K';
            return qty < 1 ? qty.toFixed(4) : qty.toFixed(2);
        }

        function renderOrderBook(bids, asks) {
            const bidsTable = document.getElementById('bidsTable');
            const asksTable = document.getElementById('asksTable');
            bidsTable.innerHTML = ''; asksTable.innerHTML = '';

            let totalAskVolume = 0;
            let totalBidVolume = 0;
            let maxVolume = 0;

            const askList = asks.map(item => {
                const price = parseFloat(item[0]);
                const amount = parseFloat(item[1]);
                const total = price * amount;
                totalAskVolume += total;
                if (amount > maxVolume) maxVolume = amount;
                return { price, amount, total };
            });

            const bidList = bids.map(item => {
                const price = parseFloat(item[0]);
                const amount = parseFloat(item[1]);
                const total = price * amount;
                totalBidVolume += total;
                if (amount > maxVolume) maxVolume = amount;
                return { price, amount, total };
            });

            // Oran Çubuğu Hesaplama
            const totalSum = totalAskVolume + totalBidVolume;
            if (totalSum > 0) {
                const buyPct = ((totalBidVolume / totalSum) * 100).toFixed(2);
                const sellPct = ((totalAskVolume / totalSum) * 100).toFixed(2);
                document.getElementById('buyRatioText').innerText = `%${buyPct}`;
                document.getElementById('sellRatioText').innerText = `%${sellPct}`;
                document.getElementById('buyRatioBar').style.width = `${buyPct}%`;
                document.getElementById('sellRatioBar').style.width = `${sellPct}%`;
            }

            // Satış Emri Satırları
            askList.reverse().forEach(item => {
                const depthWidth = maxVolume > 0 ? (item.amount / maxVolume) * 100 : 0;
                const tr = document.createElement('tr');
                tr.className = 'asks';
                tr.innerHTML = `
                    <div class="depth-bar" style="width: ${depthWidth}%"></div>
                    <td class="price-cell">${item.price < 1 ? item.price.toFixed(6) : item.price.toFixed(2)}</td>
                    <td>${formatQuantity(item.amount)}</td>
                    <td>$${Math.round(item.total).toLocaleString()}</td>
                `;
                asksTable.appendChild(tr);
            });

            // Alış Emri Satırları
            bidList.forEach(item => {
                const depthWidth = maxVolume > 0 ? (item.amount / maxVolume) * 100 : 0;
                const tr = document.createElement('tr');
                tr.className = 'bids';
                tr.innerHTML = `
                    <div class="depth-bar" style="width: ${depthWidth}%"></div>
                    <td class="price-cell">${item.price < 1 ? item.price.toFixed(6) : item.price.toFixed(2)}</td>
                    <td>${formatQuantity(item.amount)}</td>
                    <td>$${Math.round(item.total).toLocaleString()}</td>
                `;
                bidsTable.appendChild(tr);
            });
        }

        function openAddModal() { document.getElementById('addModal').style.display = 'flex'; }
        
        function openAlarmModal(symbol, name) {
            targetAlarmSymbol = symbol;
            const t = i18n[currentLang] || i18n['en'];
            document.getElementById('alarmModalTitle').innerText = `${name} - ${t.settingsAlarm}`;
            
            const current = alarms[symbol] || {};
            document.getElementById('alarmTargetPrice').value = current.targetPrice || '';
            document.getElementById('alarmVolumeThreshold').value = current.volumeThreshold || '';

            const mode = current.mode || 'once';
            document.querySelector(`input[name="alarmMode"][value="${mode}"]`).checked = true;

            const alarmsBox = document.getElementById('activeAlarmsBox');
            const alarmsList = document.getElementById('activeAlarmsList');
            alarmsList.innerHTML = '';

            let hasAny = false;
            const modeText = mode === 'once' ? t.once : t.persistent;

            if (current.targetPrice) {
                hasAny = true;
                alarmsList.innerHTML += `<div class="alarm-item"><span>${t.alarmTargetText}: <strong>$${current.targetPrice}</strong> (${modeText})</span><span class="alarm-delete" onclick="deleteAlarm('price')">✕</span></div>`;
            }
            if (current.volumeThreshold) {
                hasAny = true;
                alarmsList.innerHTML += `<div class="alarm-item"><span>${t.alarmVolText}: <strong>$${current.volumeThreshold.toLocaleString()}</strong> (${modeText})</span><span class="alarm-delete" onclick="deleteAlarm('volume')">✕</span></div>`;
            }

            alarmsBox.style.display = hasAny ? 'block' : 'none';
            document.getElementById('alarmModal').style.display = 'flex';
        }

        function deleteAlarm(type) {
            if (alarms[targetAlarmSymbol]) {
                if (type === 'price') delete alarms[targetAlarmSymbol].targetPrice;
                if (type === 'volume') delete alarms[targetAlarmSymbol].volumeThreshold;
                renderGrid();
                openAlarmModal(targetAlarmSymbol, targetAlarmSymbol.toUpperCase());
            }
        }

        function removeCurrentSymbol() {
            const currentList = getCurrentList();
            currentList.symbols = currentList.symbols.filter(s => s.symbol !== targetAlarmSymbol);
            delete alarms[targetAlarmSymbol];

            if (selectedSymbol === targetAlarmSymbol) {
                selectedSymbol = currentList.symbols.length > 0 ? currentList.symbols[0].symbol : '';
                if (selectedSymbol) selectSymbol(selectedSymbol, currentList.symbols[0].name);
            }

            renderGrid();
            closeModal('alarmModal');
            const t = i18n[currentLang] || i18n['en'];
            showToast(t.toastRemoved.replace('{sym}', targetAlarmSymbol.toUpperCase()));
        }

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function addNewSymbol() {
            const input = document.getElementById('newSymbolInput').value.trim().toLowerCase();
            if (input) {
                const formattedName = `${input.replace('usdt', '').toUpperCase()}/USDT`;
                const currentList = getCurrentList();
                currentList.symbols.push({ symbol: input, name: formattedName });
                renderGrid();
                closeModal('addModal');
                document.getElementById('newSymbolInput').value = '';
            }
        }

        function saveAlarmSettings() {
            const price = document.getElementById('alarmTargetPrice').value;
            const volume = document.getElementById('alarmVolumeThreshold').value;
            const selectedMode = document.querySelector('input[name="alarmMode"]:checked').value;

            alarms[targetAlarmSymbol] = {
                targetPrice: price ? parseFloat(price) : null,
                volumeThreshold: volume ? parseFloat(volume) : null,
                mode: selectedMode
            };

            renderGrid();
            closeModal('alarmModal');
            const t = i18n[currentLang] || i18n['en'];
            showToast(t.toastSaved.replace('{sym}', targetAlarmSymbol.toUpperCase()));
        }

        renderTabs();
        renderGrid();
        connectDepthStream();
    </script>
</body>
</html>
