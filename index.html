<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ObTrader - TabTrader View</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #000000; color: #eaecef; padding: 10px; -webkit-user-select: none; }
        
        /* Üst Header Bar */
        .app-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 5px; border-bottom: 1px solid #1e2329; margin-bottom: 10px; }
        .app-title { font-size: 18px; font-weight: bold; color: #fff; display: flex; align-items: center; gap: 8px; }
        .app-title span { color: #16f7d1; font-size: 10px; background: rgba(22, 247, 209, 0.15); padding: 2px 6px; border-radius: 4px; }

        /* Dil Seçici */
        .lang-select {
            background: #121418;
            color: #16f7d1;
            border: 1px solid rgba(22, 247, 209, 0.3);
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 11px;
            font-weight: bold;
            outline: none;
            cursor: pointer;
        }

        /* Kategori Sekmeleri */
        .tabs-container { display: flex; align-items: center; border-bottom: 1px solid #1e2329; margin-bottom: 12px; gap: 8px; overflow-x: auto; }
        .tabs { display: flex; gap: 12px; font-size: 13px; color: #848e9c; }
        .tab { padding: 6px 10px; cursor: pointer; white-space: nowrap; border-bottom: 2px solid transparent; transition: all 0.2s; }
        .tab.active { color: #fff; font-weight: bold; border-bottom-color: #16f7d1; }
        
        .btn-add-tab { 
            background: rgba(22, 247, 209, 0.1); 
            color: #16f7d1; 
            border: 1px solid rgba(22, 247, 209, 0.3); 
            width: 24px; 
            height: 24px; 
            border-radius: 4px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: bold;
            margin-bottom: 4px;
            flex-shrink: 0;
        }

        /* TABTRADER GRID (Mobil Uyumlu) */
        .watch-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 8px; 
            margin-bottom: 15px; 
        }

        @media (min-width: 768px) {
            .watch-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
        }

        /* Coin Kart Yapısı */
        .card { 
            background: #121418; 
            border: 1px solid #1e2329; 
            border-radius: 8px; 
            padding: 10px; 
            position: relative; 
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 90px;
        }
        .card.active { border-color: #16f7d1; }
        
        .card-header { display: flex; justify-content: space-between; align-items: center; }
        .symbol-name { font-size: 13px; font-weight: 700; color: #fff; }
        .header-right { display: flex; align-items: center; gap: 6px; }
        .change { font-size: 11px; font-weight: 600; }
        
        .up { color: #0ecb81; }
        .down { color: #f6465d; }

        .more-btn { 
            color: #848e9c; 
            font-size: 16px; 
            padding: 0 4px; 
            cursor: pointer; 
            line-height: 1;
            position: relative;
        }
        .has-alarm::after {
            content: '';
            position: absolute;
            top: 2px;
            right: 2px;
            width: 5px;
            height: 5px;
            background-color: #16f7d1;
            border-radius: 50%;
        }

        .card-body { display: flex; justify-content: center; align-items: center; flex-grow: 1; }
        .price { font-size: 16px; font-weight: 700; font-family: monospace; color: #fff; text-align: center; }

        .card-add-box {
            background: #0a0c0e;
            border: 1px dashed #2b313a;
            border-radius: 8px;
            height: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        .card-add-icon { font-size: 28px; color: #16f7d1; font-weight: 300; }

        /* CANLI TAHTA */
        .ob-drawer { background: #121418; border: 1px solid #1e2329; padding: 12px; border-radius: 8px; margin-top: 10px; }
        .ob-header { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 13px; font-weight: bold; color: #16f7d1; }
        
        .orderbook-table { width: 100%; border-collapse: collapse; font-family: monospace; font-size: 11px; table-layout: fixed; }
        .orderbook-table th { color: #848e9c; font-weight: normal; padding-bottom: 6px; border-bottom: 1px solid #2b313a; text-align: right; }
        .orderbook-table th:first-child { text-align: left; }
        .orderbook-table tr { height: 22px; }
        .orderbook-table td { padding: 3px 4px; text-align: right; font-weight: 500; }
        
        .asks td.price { color: #f6465d; text-align: left; font-weight: 600; }
        .bids td.price { color: #0ecb81; text-align: left; font-weight: 600; }

        /* Ortadaki Canlı Fiyat Bandı */
        .mid-price-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            margin: 6px 0;
            background: #1a1d24;
            border-top: 1px solid #2b313a;
            border-bottom: 1px solid #2b313a;
            border-radius: 4px;
        }
        .mid-price-val { font-size: 15px; font-weight: bold; font-family: monospace; }
        .mid-price-val.up { color: #0ecb81; }
        .mid-price-val.down { color: #f6465d; }
        .mid-price-sub { font-size: 11px; color: #848e9c; }

        /* Alım / Satım Oran Çizelgesi */
        .ratio-container {
            margin-top: 12px;
            padding-top: 8px;
            border-top: 1px solid #1e2329;
        }
        .ratio-labels {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 4px;
        }
        .ratio-buy-text { color: #0ecb81; }
        .ratio-sell-text { color: #f6465d; }
        .ratio-bar-bg {
            height: 6px;
            width: 100%;
            background: #f6465d;
            border-radius: 3px;
            overflow: hidden;
            display: flex;
        }
        .ratio-bar-fill {
            height: 100%;
            background: #0ecb81;
            width: 50%;
            transition: width 0.3s ease;
        }

        /* MODAL YAPISI */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 100; padding: 15px; }
        .modal-content { background: #121418; padding: 20px; border-radius: 8px; width: 100%; max-width: 400px; border: 1px solid #2b313a; position: relative; }
        
        .modal-close-x { position: absolute; top: 12px; right: 15px; color: #848e9c; font-size: 18px; cursor: pointer; font-weight: bold; }

        .modal-content h3 { margin-bottom: 15px; color: #fff; font-size: 15px; border-bottom: 1px solid #2b313a; padding-bottom: 8px; padding-right: 25px; }
        
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 11px; color: #848e9c; margin-bottom: 4px; }
        .form-group input[type="text"], .form-group input[type="number"] { width: 100%; padding: 10px; background: #1a1d24; border: 1px solid #363c4e; color: #fff; border-radius: 4px; font-size: 13px; outline: none; }
        
        .radio-group { display: flex; gap: 15px; margin-top: 6px; }
        .radio-option { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #eaecef; cursor: pointer; }
        .radio-option input { accent-color: #16f7d1; }

        .active-alarms-box { background: #000000; border: 1px solid #2b313a; border-radius: 4px; padding: 8px; margin-top: 10px; }
        .active-alarms-title { font-size: 11px; color: #16f7d1; font-weight: bold; margin-bottom: 6px; }
        .alarm-item { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: #eaecef; background: #1a1d24; padding: 5px 8px; border-radius: 3px; margin-bottom: 4px; }
        .alarm-delete { color: #f6465d; cursor: pointer; font-weight: bold; }

        .modal-buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 15px; }
        .btn { padding: 10px 16px; border-radius: 4px; border: none; font-weight: bold; cursor: pointer; font-size: 12px; }
        .btn-add { background: #16f7d1; color: #000000; }
        .btn-close { background: #363c4e; color: #fff; }

        .remove-coin-link { display: block; text-align: center; color: #f6465d; font-size: 11px; margin-top: 15px; cursor: pointer; text-decoration: underline; }

        /* TOAST BİLDİRİM */
        .toast-container { position: fixed; bottom: 20px; left: 15px; right: 15px; z-index: 200; pointer-events: none; }
        .toast { background: #16f7d1; color: #000000; padding: 12px 16px; border-radius: 6px; font-weight: bold; font-size: 12px; margin-top: 8px; box-shadow: 0 4px 12px rgba(22, 247, 209, 0.3); animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body>

    <div class="app-bar">
        <div class="app-title">OBTRADER <span>ULTRA</span></div>
        <select class="lang-select" id="langSelect" onchange="changeLanguage(this.value)">
            <option value="en">EN 🇺🇸</option>
            <option value="zh">ZH 🇨🇳</option>
            <option value="tr" selected>TR 🇹🇷</option>
            <option value="de">DE 🇩🇪</option>
            <option value="ko">KO 🇰🇷</option>
            <option value="es">ES 🇪🇸</option>
            <option value="ar">AR 🇸🇦</option>
            <option value="fr">FR 🇫🇷</option>
        </select>
    </div>

    <div class="tabs-container">
        <div class="tabs" id="tabList"></div>
        <button class="btn-add-tab" onclick="createNewTab()" id="btnNewTabTitle" title="Yeni Liste">＋</button>
    </div>

    <div class="watch-grid" id="watchGrid"></div>

    <div class="ob-drawer">
        <div class="ob-header">
            <span id="activeSymbolTitle">BTC/USDT</span>
            <span style="color: #848e9c; font-size: 11px;" id="lblDepth">Derinlik: 20x20</span>
        </div>
        <table class="orderbook-table">
            <thead>
                <tr>
                    <th id="thPrice">Fiyat ($)</th>
                    <th id="thAmount">Miktar</th>
                    <th id="thTotal">Toplam ($)</th>
                </tr>
            </thead>
            <tbody id="asksTable" class="asks"></tbody>
        </table>

        <!-- Ortadaki Anlık Canlı Fiyat -->
        <div class="mid-price-bar">
            <div class="mid-price-val" id="midPrice">--</div>
            <div class="mid-price-sub" id="midPriceSpread">Yayılma: --</div>
        </div>

        <table class="orderbook-table">
            <tbody id="bidsTable" class="bids"></tbody>
        </table>

        <!-- En Alttaki Alım/Satım Oran Çizelgesi -->
        <div class="ratio-container">
            <div class="ratio-labels">
                <span class="ratio-buy-text" id="ratioBuyText">Alım %50.0</span>
                <span class="ratio-sell-text" id="ratioSellText">%50.0 Satım</span>
            </div>
            <div class="ratio-bar-bg">
                <div class="ratio-bar-fill" id="ratioBarFill"></div>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <!-- MODAL: Coin Ekleme -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <span class="modal-close-x" onclick="closeModal('addModal')">✕</span>
            <h3 id="modalAddTitle">İzleme Listesine Parite Ekle</h3>
            <div class="form-group">
                <label id="lblCoinSymbol">Coin Sembolü</label>
                <input type="text" id="newSymbolInput" placeholder="Örn: solusdt veya dogeusdt">
            </div>
            <div class="modal-buttons">
                <button class="btn btn-close" onclick="closeModal('addModal')" id="btnCancel">İptal</button>
                <button class="btn btn-add" onclick="addNewSymbol()" id="btnAdd">Ekle</button>
            </div>
        </div>
    </div>

    <!-- MODAL: Alarm & Ayarlar -->
    <div class="modal" id="alarmModal">
        <div class="modal-content">
            <span class="modal-close-x" onclick="closeModal('alarmModal')">✕</span>
            <h3 id="alarmModalTitle">Coin Ayarları & Alarm</h3>
            
            <div class="form-group">
                <label id="lblTargetPrice">1. Hedef Fiyat Tetiklemesi ($)</label>
                <input type="number" id="alarmTargetPrice" step="any" placeholder="0.00">
            </div>
            
            <div class="form-group">
                <label id="lblWhaleVol">2. Tahta Balina Emri Alarmı (Min $ Hacim)</label>
                <input type="number" id="alarmVolumeThreshold" step="10000" placeholder="250000">
            </div>

            <div class="form-group">
                <label id="lblAlarmType">Alarm Çalışma Tipi</label>
                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" name="alarmMode" value="once" checked> <span id="lblModeOnce">Tek Seferlik</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="alarmMode" value="persistent"> <span id="lblModePersistent">Sürekli</span>
                    </label>
                </div>
            </div>

            <div class="active-alarms-box" id="activeAlarmsBox" style="display: none;">
                <div class="active-alarms-title" id="lblActiveAlarms">Aktif Alarmlar</div>
                <div id="activeAlarmsList"></div>
            </div>

            <div class="modal-buttons">
                <button class="btn btn-close" onclick="closeModal('alarmModal')" id="btnClose">Kapat</button>
                <button class="btn btn-add" onclick="saveAlarmSettings()" id="btnSaveAlarm">Alarmı Kaydet</button>
            </div>

            <span class="remove-coin-link" onclick="removeCurrentSymbol()" id="btnRemoveCoin">Bu coin çiftini listeden kaldır</span>
        </div>
    </div>

                depth: "العمق: 20x20",
                price: "السعر ($)",
                amount: "الكمية",
                total: "الإجمالي ($)",
                addModalTitle: "إضافة زوج إلى القائمة",
                coinSymbol: "رمز العملة",
                symbolPlaceholder: "مثال: solusdt أو dogeusdt",
                cancel: "إلغاء",
                add: "إضافة",
                settingsAlarm: "الإعدادات والتنبيه",
                targetPrice: "1. سعر الهدف للتنبيه ($)",
                whaleVol: "2. تنبيه طلبات الحيتان (أقل حجم $)",
                alarmType: "وضع التنبيه",
                once: "مرة واحدة",
                persistent: "مستمر",
                activeAlarms: "التنبيهات النشطة",
                close: "إغلاق",
                saveAlarm: "حفظ التنبيه",
                removeCoin: "إزالة هذا الزوج من القائمة",
                alarmTargetText: "السعر Target",
                alarmVolText: "أدنى حجم",
                toastPrice: "🔔 تنبيه: وصلت {sym} إلى السعر المستهدف ${target}!",
                toastWhaleSell: "🚨 طلب حوت: جدار بيع بقيمة ${vol} على {sym}!",
                toastWhaleBuy: "🚨 طلب حوت: جدار شراء بقيمة ${vol} على {sym}!",
                toastRemoved: "تمت إزالة {sym}.",
                toastSaved: "تم حفظ التنبيه لـ {sym}."
            },
            fr: {
                mainList: "Liste Principale",
                listPrefix: "Liste",
                liveBoard: "Carnet d'ordres",
                depth: "Profondeur: 20x20",
                price: "Prix ($)",
                amount: "Quantité",
                total: "Total ($)",
                addModalTitle: "Ajouter une Paire",
                coinSymbol: "Symbole Coin",
                symbolPlaceholder: "Ex: solusdt ou dogeusdt",
                cancel: "Annuler",
                add: "Ajouter",
                settingsAlarm: "Paramètres & Alarme",
                targetPrice: "1. Déclencheur Prix Cible ($)",
                whaleVol: "2. Alerte Ordre Baleine (Vol Min $)",
                alarmType: "Mode Alarme",
                once: "Une Fois",
                persistent: "Persistant",
                activeAlarms: "Alarmes Actives",
                close: "Fermer",
                saveAlarm: "Enregistrer l'Alarme",
                removeCoin: "Retirer cette paire de la liste",
                alarmTargetText: "Prix Cible",
                alarmVolText: "Vol Min",
                toastPrice: "🔔 ALARME: {sym} a atteint le prix cible de ${target}!",
                toastWhaleSell: "🚨 ORDRE BALEINE: Mur de VENTE de ${vol} sur {sym}!",
                toastWhaleBuy: "🚨 ORDRE BALEINE: Mur d'ACHAT de ${vol} sur {sym}!",
                toastRemoved: "{sym} retiré.",
                toastSaved: "Alarme enregistrée pour {sym}."
            }
        };

        let currentLang = 'tr';
        let lists = [
            {
                id: 'main',
                titleKey: 'mainList',
                title: i18n['tr'].mainList,
                symbols: [
                    { symbol: 'btcusdt', name: 'BTC/USDT' },
                    { symbol: 'ethusdt', name: 'ETH/USDT' }
                ]
            }
        ];

        let activeListId = 'main';
        let selectedSymbol = 'btcusdt';
        let targetAlarmSymbol = '';
        let tickerWs, depthWs;
        let alarms = {};
        let lastPrices = {};

        function changeLanguage(lang) {
            currentLang = lang;
            document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';

            const t = i18n[lang];
            document.getElementById('lblDepth').innerText = t.depth;
            document.getElementById('thPrice').innerText = t.price;
            document.getElementById('thAmount').innerText = t.amount;
            document.getElementById('thTotal').innerText = t.total;
            document.getElementById('modalAddTitle').innerText = t.addModalTitle;
            document.getElementById('lblCoinSymbol').innerText = t.coinSymbol;
            document.getElementById('newSymbolInput').placeholder = t.symbolPlaceholder;
            document.getElementById('btnCancel').innerText = t.cancel;
            document.getElementById('btnAdd').innerText = t.add;
            document.getElementById('lblTargetPrice').innerText = t.targetPrice;
            document.getElementById('lblWhaleVol').innerText = t.whaleVol;
            document.getElementById('lblAlarmType').innerText = t.alarmType;
            document.getElementById('lblModeOnce').innerText = t.once;
            document.getElementById('lblModePersistent').innerText = t.persistent;
            document.getElementById('lblActiveAlarms').innerText = t.activeAlarms;
            document.getElementById('btnClose').innerText = t.close;
            document.getElementById('btnSaveAlarm').innerText = t.saveAlarm;
            document.getElementById('btnRemoveCoin').innerText = t.removeCoin;

            lists.forEach((l, idx) => {
                if(l.titleKey) l.title = t[l.titleKey];
                else l.title = `${t.listPrefix} ${idx + 1}`;
            });

            renderTabs();
            renderGrid();
            updateLiveBoardTitle();
        }

        function playBeep() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, ctx.currentTime);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            } catch(e) {}
        }

        function showToast(msg) {
            playBeep();
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerText = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        function renderTabs() {
            const tabList = document.getElementById('tabList');
            tabList.innerHTML = '';

            lists.forEach(l => {
                const tab = document.createElement('div');
                tab.className = `tab ${l.id === activeListId ? 'active' : ''}`;
                tab.innerText = l.title;
                tab.onclick = () => switchTab(l.id);
                tabList.appendChild(tab);
            });
        }

        function createNewTab() {
            const newId = 'list_' + Date.now();
            const t = i18n[currentLang];
            const newTitle = `${t.listPrefix} ${lists.length + 1}`;
            
            lists.push({
                id: newId,
                title: newTitle,
                symbols: [
                    { symbol: 'btcusdt', name: 'BTC/USDT' },
                    { symbol: 'ethusdt', name: 'ETH/USDT' }
                ]
            });

            switchTab(newId);
        }

        function switchTab(listId) {
            activeListId = listId;
            renderTabs();
            
            const currentList = getCurrentList();
            if (currentList.symbols.length > 0) {
                selectedSymbol = currentList.symbols[0].symbol;
                selectSymbol(selectedSymbol, currentList.symbols[0].name);
            } else {
                selectedSymbol = '';
            }

            renderGrid();
        }

        function getCurrentList() {
            return lists.find(l => l.id === activeListId);
        }

        function renderGrid() {
            const grid = document.getElementById('watchGrid');
            grid.innerHTML = '';

            const currentList = getCurrentList();

            currentList.symbols.forEach(item => {
                const card = document.createElement('div');
                card.className = `card ${item.symbol === selectedSymbol ? 'active' : ''}`;
                card.id = `card-${item.symbol}`;
                
                card.onclick = (e) => {
                    if(!e.target.classList.contains('more-btn')) {
                        selectSymbol(item.symbol, item.name);
                    }
                };

                const hasAlarm = alarms[item.symbol] && (alarms[item.symbol].targetPrice || alarms[item.symbol].volumeThreshold);

                card.innerHTML = `
                    <div class="card-header">
                        <div class="symbol-name">${item.name}</div>
                        <div class="header-right">
                            <div class="change" id="change-${item.symbol}">%0.00</div>
                            <div class="more-btn ${hasAlarm ? 'has-alarm' : ''}" onclick="openAlarmModal('${item.symbol}', '${item.name}')">⋮</div>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="price" id="price-${item.symbol}">--</div>
                    </div>
                `;
                grid.appendChild(card);
            });

            const addCard = document.createElement('div');
            addCard.className = 'card-add-box';
            addCard.onclick = openAddModal;
            addCard.innerHTML = `<div class="card-add-icon">＋</div>`;
            grid.appendChild(addCard);

            connectTickerStream();
        }

        function connectTickerStream() {
            if (tickerWs) tickerWs.close();
            const currentList = getCurrentList();
            if (!currentList || currentList.symbols.length === 0) return;

            const streams = currentList.symbols.map(i => `${i.symbol}@ticker`).join('/');
            tickerWs = new WebSocket(`wss://stream.binance.com:9443/ws/${streams}`);

            tickerWs.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.s) {
                    const sym = data.s.toLowerCase();
                    const price = parseFloat(data.c);
                    const change = parseFloat(data.P);

                    const priceEl = document.getElementById(`price-${sym}`);
                    const changeEl = document.getElementById(`change-${sym}`);

                    if (priceEl && changeEl) {
                        priceEl.innerText = price < 1 ? price.toFixed(6) : price.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
                        changeEl.innerText = `${change >= 0 ? '+' : ''}${change.toFixed(2)}%`;
                        changeEl.className = `change ${change >= 0 ? 'up' : 'down'}`;
                    }

                    // Hedef Fiyat Alarm Kontrolü
                    if (alarms[sym] && alarms[sym].targetPrice) {
                        const target = alarms[sym].targetPrice;
                        const prev = lastPrices[sym];
                        if (prev && ((prev < target && price >= target) || (prev > target && price <= target))) {
                            const msg = i18n[currentLang].toastPrice.replace('{sym}', sym.toUpperCase()).replace('{target}', target);
                            showToast(msg);
                            if (alarms[sym].mode === 'once') {
                                delete alarms[sym].targetPrice;
                                renderGrid();
                            }
                        }
                    }
                    lastPrices[sym] = price;
                }
            };
        }

        function selectSymbol(sym, name) {
            selectedSymbol = sym;
            document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
            const card = document.getElementById(`card-${sym}`);
            if (card) card.classList.add('active');

            updateLiveBoardTitle(name);
            connectDepthStream();
        }

        function updateLiveBoardTitle(name) {
            const currentList = getCurrentList();
            const currentItem = currentList ? currentList.symbols.find(s => s.symbol === selectedSymbol) : null;
            const displayName = name || (currentItem ? currentItem.name : '---');
            document.getElementById('activeSymbolTitle').innerText = displayName;
        }

        function connectDepthStream() {
            if (depthWs) depthWs.close();
            if (!selectedSymbol) return;

            depthWs = new WebSocket(`wss://stream.binance.com:9443/ws/${selectedSymbol}@depth10@100ms`);

            depthWs.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.asks && data.bids) {
                    renderOrderBook(data.asks, data.bids);
                }
            };
        }

        function renderOrderBook(asks, bids) {
            const asksTable = document.getElementById('asksTable');
            const bidsTable = document.getElementById('bidsTable');

            let askTotal = 0;
            let bidTotal = 0;

            const askList = asks.slice(0, 8).map(item => {
                const price = parseFloat(item[0]);
                const amount = parseFloat(item[1]);
                const total = price * amount;
                askTotal += total;
                return { price, amount, total, cumulativeTotal: askTotal };
            });

            const bidList = bids.slice(0, 8).map(item => {
                const price = parseFloat(item[0]);
                const amount = parseFloat(item[1]);
                const total = price * amount;
                bidTotal += total;
                return { price, amount, total, cumulativeTotal: bidTotal };
            });

            const maxAskTotal = askTotal || 1;
            const maxBidTotal = bidTotal || 1;

            // Asks Render (Satışlar - Kırmızı Derinlik Arka Planı)
            asksTable.innerHTML = askList.reverse().map(item => {
                const depthPercent = Math.min(100, (item.cumulativeTotal / maxAskTotal) * 100).toFixed(1);
                const bgStyle = `background: linear-gradient(to left, rgba(246, 70, 93, 0.25) ${depthPercent}%, transparent ${depthPercent}%);`;
                return `
                    <tr style="${bgStyle}">
                        <td class="price">${item.price < 1 ? item.price.toFixed(6) : item.price.toFixed(2)}</td>
                        <td>${item.amount.toFixed(4)}</td>
                        <td>${Math.round(item.total).toLocaleString()}</td>
                    </tr>
                `;
            }).join('');

            // Bids Render (Alışlar - Yeşil Derinlik Arka Planı)
            bidsTable.innerHTML = bidList.map(item => {
                const depthPercent = Math.min(100, (item.cumulativeTotal / maxBidTotal) * 100).toFixed(1);
                const bgStyle = `background: linear-gradient(to left, rgba(14, 203, 129, 0.25) ${depthPercent}%, transparent ${depthPercent}%);`;
                return `
                    <tr style="${bgStyle}">
                        <td class="price">${item.price < 1 ? item.price.toFixed(6) : item.price.toFixed(2)}</td>
                        <td>${item.amount.toFixed(4)}</td>
                        <td>${Math.round(item.total).toLocaleString()}</td>
                    </tr>
                `;
            }).join('');

            // Ortadaki Canlı Fiyat Bandı Hesaplama
            const bestAsk = askList[askList.length - 1] ? askList[askList.length - 1].price : 0;
            const bestBid = bidList[0] ? bidList[0].price : 0;
            const midPrice = bestBid ? ((bestAsk + bestBid) / 2) : bestAsk;
            const spread = Math.abs(bestAsk - bestBid);

            const midPriceEl = document.getElementById('midPrice');
            const midSpreadEl = document.getElementById('midPriceSpread');
            
            if (midPrice > 0) {
                const prevMid = parseFloat(midPriceEl.getAttribute('data-prev') || 0);
                midPriceEl.innerText = midPrice < 1 ? midPrice.toFixed(6) : midPrice.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
                midPriceEl.className = `mid-price-val ${midPrice >= prevMid ? 'up' : 'down'}`;
                midPriceEl.setAttribute('data-prev', midPrice);

                midSpreadEl.innerText = `Spread: ${spread < 1 ? spread.toFixed(4) : spread.toFixed(2)}`;
            }

            // Alım / Satım Hacim Oranı Çizelgesi
            const totalVol = askTotal + bidTotal;
            const buyRatio = totalVol > 0 ? (bidTotal / totalVol) * 100 : 50;

            document.getElementById('ratioBuyText').innerText = `Alım %${buyRatio.toFixed(1)}`;
            document.getElementById('ratioSellText').innerText = `%${(100 - buyRatio).toFixed(1)} Satım`;
            document.getElementById('ratioBarFill').style.width = `${buyRatio}%`;

            // Tahta Balina Alarmı Kontrolü
            if (alarms[selectedSymbol] && alarms[selectedSymbol].volumeThreshold) {
                const threshold = alarms[selectedSymbol].volumeThreshold;
                askList.forEach(item => {
                    if (item.total >= threshold) {
                        const msg = i18n[currentLang].toastWhaleSell.replace('{sym}', selectedSymbol.toUpperCase()).replace('{vol}', Math.round(item.total).toLocaleString());
                        showToast(msg);
                    }
                });
                bidList.forEach(item => {
                    if (item.total >= threshold) {
                        const msg = i18n[currentLang].toastWhaleBuy.replace('{sym}', selectedSymbol.toUpperCase()).replace('{vol}', Math.round(item.total).toLocaleString());
                        showToast(msg);
                    }
                });
            }
        }

        function openAddModal() {
            document.getElementById('addModal').style.display = 'flex';
        }

        function openAlarmModal(sym, name) {
            targetAlarmSymbol = sym;
            const modal = document.getElementById('alarmModal');
            document.getElementById('alarmModalTitle').innerText = `${name} - ${i18n[currentLang].settingsAlarm}`;
            
            const conf = alarms[sym] || {};
            document.getElementById('alarmTargetPrice').value = conf.targetPrice || '';
            document.getElementById('alarmVolumeThreshold').value = conf.volumeThreshold || '';

            renderActiveAlarmsList(sym);
            modal.style.display = 'flex';
        }

        function renderActiveAlarmsList(sym) {
            const box = document.getElementById('activeAlarmsBox');
            const list = document.getElementById('activeAlarmsList');
            const conf = alarms[sym];

            if (conf && (conf.targetPrice || conf.volumeThreshold)) {
                box.style.display = 'block';
                list.innerHTML = '';
                const t = i18n[currentLang];

                if(conf.targetPrice) {
                    list.innerHTML += `
                        <div class="alarm-item">
                            <span>🎯 ${t.alarmTargetText}: $${conf.targetPrice}</span>
                            <span class="alarm-delete" onclick="clearAlarmProp('${sym}', 'targetPrice')">✕</span>
                        </div>
                    `;
                }
                if(conf.volumeThreshold) {
                    list.innerHTML += `
                        <div class="alarm-item">
                            <span>🐋 ${t.alarmVolText}: $${conf.volumeThreshold.toLocaleString()}</span>
                            <span class="alarm-delete" onclick="clearAlarmProp('${sym}', 'volumeThreshold')">✕</span>
                        </div>
                    `;
                }
            } else {
                box.style.display = 'none';
            }
        }

        function clearAlarmProp(sym, prop) {
            if (alarms[sym]) {
                delete alarms[sym][prop];
                renderActiveAlarmsList(sym);
                renderGrid();
            }
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        function addNewSymbol() {
            const input = document.getElementById('newSymbolInput');
            let raw = input.value.trim().toLowerCase();
            if (!raw) return;

            if (!raw.endsWith('usdt')) raw += 'usdt';
            const name = raw.replace('usdt', '').toUpperCase() + '/USDT';

            const currentList = getCurrentList();
            if (!currentList.symbols.some(s => s.symbol === raw)) {
                currentList.symbols.push({ symbol: raw, name: name });
                renderGrid();
                selectSymbol(raw, name);
            }

            input.value = '';
            closeModal('addModal');
        }

        function saveAlarmSettings() {
            const targetPrice = parseFloat(document.getElementById('alarmTargetPrice').value);
            const volumeThreshold = parseFloat(document.getElementById('alarmVolumeThreshold').value);
            const mode = document.querySelector('input[name="alarmMode"]:checked').value;

            if (targetAlarmSymbol) {
                alarms[targetAlarmSymbol] = {
                    targetPrice: targetPrice || null,
                    volumeThreshold: volumeThreshold || null,
                    mode: mode
                };
                
                const msg = i18n[currentLang].toastSaved.replace('{sym}', targetAlarmSymbol.toUpperCase());
                showToast(msg);
                renderGrid();
            }

            closeModal('alarmModal');
        }

        function removeCurrentSymbol() {
            if (!targetAlarmSymbol) return;

            const currentList = getCurrentList();
            currentList.symbols = currentList.symbols.filter(s => s.symbol !== targetAlarmSymbol);
            
            delete alarms[targetAlarmSymbol];

            const msg = i18n[currentLang].toastRemoved.replace('{sym}', targetAlarmSymbol.toUpperCase());
            showToast(msg);

            closeModal('alarmModal');

            if (currentList.symbols.length > 0) {
                selectSymbol(currentList.symbols[0].symbol, currentList.symbols[0].name);
            } else {
                selectedSymbol = '';
                updateLiveBoardTitle('---');
            }

            renderGrid();
        }

        // Başlangıç Yüklemesi
        renderTabs();
        renderGrid();
        connectDepthStream();
    </script>
