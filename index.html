<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ObTrader Live</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #000000; color: #eaecef; padding: 10px; -webkit-user-select: none; }
        
        /* Üst Header Bar */
        .app-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 5px; border-bottom: 1px solid #1e2329; margin-bottom: 10px; }
        .app-title { font-size: 18px; font-weight: bold; color: #fff; display: flex; align-items: center; gap: 8px; }
        .app-title span { color: #16f7d1; font-size: 10px; background: rgba(22, 247, 209, 0.15); padding: 2px 6px; border-radius: 4px; font-weight: 800; letter-spacing: 0.5px; }

        /* Dil Seçici */
        .lang-select {
            background: #121418;
            color: #16f7d1;
            border: 1px solid rgba(22, 247, 209, 0.3);
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 11px;
            font-weight: bold;
            outline: none;
            cursor: pointer;
        }

        /* Kategori Sekmeleri */
        .tabs-container { display: flex; align-items: center; border-bottom: 1px solid #1e2329; margin-bottom: 12px; gap: 8px; overflow-x: auto; }
        .tabs { display: flex; gap: 12px; font-size: 13px; color: #848e9c; }
        .tab { padding: 6px 10px; cursor: pointer; white-space: nowrap; border-bottom: 2px solid transparent; transition: all 0.2s; }
        .tab.active { color: #fff; font-weight: bold; border-bottom-color: #16f7d1; }
        
        .btn-add-tab { 
            background: rgba(22, 247, 209, 0.1); 
            color: #16f7d1; 
            border: 1px solid rgba(22, 247, 209, 0.3); 
            width: 24px; 
            height: 24px; 
            border-radius: 4px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: bold;
            margin-bottom: 4px;
            flex-shrink: 0;
        }

        /* WATCH GRID */
        .watch-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 8px; 
            margin-bottom: 15px; 
        }

        @media (min-width: 768px) {
            .watch-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
        }

        .card { 
            background: #121418; 
            border: 1px solid #1e2329; 
            border-radius: 8px; 
            padding: 10px; 
            position: relative; 
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 90px;
        }
        .card.active { border-color: #16f7d1; }
        
        .card-header { display: flex; justify-content: space-between; align-items: center; }
        .symbol-name { font-size: 13px; font-weight: 700; color: #fff; }
        .header-right { display: flex; align-items: center; gap: 6px; }
        .change { font-size: 11px; font-weight: 600; }
        
        .up { color: #0ecb81; }
        .down { color: #f6465d; }

        .more-btn { 
            color: #ffffff; 
            font-size: 20px; 
            font-weight: bold;
            padding: 2px 6px; 
            cursor: pointer; 
            line-height: 1;
            position: relative;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
        }
        .more-btn:hover {
            background: rgba(22, 247, 209, 0.2);
            color: #16f7d1;
        }
        .has-alarm::after {
            content: '';
            position: absolute;
            top: 2px;
            right: 2px;
            width: 6px;
            height: 6px;
            background-color: #16f7d1;
            border-radius: 50%;
        }

        .card-body { display: flex; justify-content: center; align-items: center; flex-grow: 1; }
        .price { font-size: 16px; font-weight: 700; font-family: monospace; color: #fff; text-align: center; }

        .card-add-box {
            background: #0a0c0e;
            border: 1px dashed #2b313a;
            border-radius: 8px;
            height: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        .card-add-icon { font-size: 28px; color: #16f7d1; font-weight: 300; }

        /* YAN YANA YAPI / GRAFİK VE TAHTA KAPSAYICISI */
        .chart-ob-wrapper {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }

        @media (min-width: 900px) {
            .chart-ob-wrapper {
                flex-direction: row;
                align-items: stretch;
            }
            .chart-container-box, .ob-drawer {
                flex: 1;
                margin-top: 0 !important;
            }
        }

        .chart-container-box {
            background: #121418;
            border: 1px solid #1e2329;
            border-radius: 8px;
            padding: 10px;
            min-height: 400px;
            display: flex;
            flex-direction: column;
        }

        .chart-header {
            font-size: 13px;
            font-weight: bold;
            color: #16f7d1;
            margin-bottom: 8px;
        }

        .tradingview-widget-container {
            flex-grow: 1;
            width: 100%;
            height: 100%;
            min-height: 360px;
        }

        /* CANLI TAHTA VE SCROLL DÜZENİ */
        .ob-drawer { background: #121418; border: 1px solid #1e2329; padding: 12px; border-radius: 8px; }
        .ob-header { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 13px; font-weight: bold; color: #16f7d1; }
        
        .orderbook-table { width: 100%; border-collapse: collapse; font-family: monospace; font-size: 11px; table-layout: fixed; }
        .orderbook-table th { color: #848e9c; font-weight: normal; padding-bottom: 6px; border-bottom: 1px solid #2b313a; text-align: right; }
        .orderbook-table th:first-child { text-align: left; }
        
        .scrollable-table-container {
            max-height: 200px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #2b313a transparent;
        }
        .scrollable-table-container::-webkit-scrollbar { width: 4px; }
        .scrollable-table-container::-webkit-scrollbar-thumb { background: #2b313a; border-radius: 2px; }

        .orderbook-table tr { height: 22px; position: relative; }
        .orderbook-table td { padding: 3px 4px; text-align: right; font-weight: 500; position: relative; z-index: 2; }
        
        .asks td.price { color: #f6465d; text-align: left; font-weight: 600; }
        .bids td.price { color: #0ecb81; text-align: left; font-weight: 600; }

        /* Ortadaki Sabit Canlı Fiyat Bandı */
        .mid-price-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            margin: 8px 0;
            background: #090a0c;
            border: 1px solid #2b313a;
            border-radius: 6px;
            position: sticky;
            top: 0;
            z-index: 5;
        }
        .mid-price-val { 
            font-size: 17px; 
            font-weight: 800; 
            font-family: monospace; 
            color: #ffffff !important; 
            letter-spacing: 0.5px;
        }
        .mid-price-sub { 
            font-size: 11px; 
            color: #848e9c; 
            font-weight: 600;
        }

        /* Alım / Satım Oran Çizelgesi */
        .ratio-container {
            margin-top: 12px;
            padding-top: 8px;
            border-top: 1px solid #1e2329;
        }
        .ratio-labels {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 4px;
        }
        .ratio-buy-text { color: #0ecb81; }
        .ratio-sell-text { color: #f6465d; }
        .ratio-bar-bg {
            height: 6px;
            width: 100%;
            background: #f6465d;
            border-radius: 3px;
            overflow: hidden;
            display: flex;
        }
        .ratio-bar-fill {
            height: 100%;
            background: #0ecb81;
            width: 50%;
            transition: width 0.3s ease;
        }

        /* MODAL YAPISI */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 100; padding: 15px; }
        .modal-content { background: #121418; padding: 20px; border-radius: 8px; width: 100%; max-width: 400px; border: 1px solid #2b313a; position: relative; }
        .modal-close-x { position: absolute; top: 12px; right: 15px; color: #848e9c; font-size: 18px; cursor: pointer; font-weight: bold; }
        .modal-content h3 { margin-bottom: 15px; color: #fff; font-size: 15px; border-bottom: 1px solid #2b313a; padding-bottom: 8px; padding-right: 25px; }
        
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 11px; color: #848e9c; margin-bottom: 4px; }
        .form-group input[type="text"], .form-group input[type="number"] { width: 100%; padding: 10px; background: #1a1d24; border: 1px solid #363c4e; color: #fff; border-radius: 4px; font-size: 13px; outline: none; }
        
        .radio-group { display: flex; gap: 15px; margin-top: 6px; }
        .radio-option { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #eaecef; cursor: pointer; }
        .radio-option input { accent-color: #16f7d1; }

        .active-alarms-box { background: #000000; border: 1px solid #2b313a; border-radius: 4px; padding: 8px; margin-top: 10px; }
        .active-alarms-title { font-size: 11px; color: #16f7d1; font-weight: bold; margin-bottom: 6px; }
        .alarm-item { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: #eaecef; background: #1a1d24; padding: 5px 8px; border-radius: 3px; margin-bottom: 4px; }
        .alarm-delete { color: #f6465d; cursor: pointer; font-weight: bold; }

        .modal-buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 15px; }
        .btn { padding: 10px 16px; border-radius: 4px; border: none; font-weight: bold; cursor: pointer; font-size: 12px; }
        .btn-add { background: #16f7d1; color: #000000; }
        .btn-close { background: #363c4e; color: #fff; }

        .remove-coin-link { display: block; text-align: center; color: #f6465d; font-size: 11px; margin-top: 15px; cursor: pointer; text-decoration: underline; }

        .toast-container { position: fixed; bottom: 20px; left: 15px; right: 15px; z-index: 200; pointer-events: none; }
        .toast { background: #16f7d1; color: #000000; padding: 12px 16px; border-radius: 6px; font-weight: bold; font-size: 12px; margin-top: 8px; box-shadow: 0 4px 12px rgba(22, 247, 209, 0.3); animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
</head>
<body>

    <div class="app-bar">
        <div class="app-title">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" style="width:24px; height:24px; display:block;">
                <path fill-rule="evenodd" d="M 145 178 A 72 72 0 1 0 145 322 A 72 72 0 1 0 145 178 Z M 145 227 A 23 23 0 1 1 145 273 A 23 23 0 1 1 145 227 Z" fill="#2b2d5c" />
                <path fill-rule="evenodd" d="M 295 178 L 348 178 A 36 36 0 0 1 348 250 L 295 250 Z M 295 250 L 354 250 A 36 36 0 0 1 354 322 L 295 322 Z M 324 202 A 12 12 0 1 0 324 226 A 12 12 0 1 0 324 202 Z M 324 274 A 12 12 0 1 0 324 298 A 12 12 0 1 0 324 274 Z" fill="#2b2d5c" />
                <rect x="236" y="120" width="28" height="260" fill="#52bab5" />
                <path d="M 75 120 L 110 85 L 390 85 L 425 120 Z" fill="#52bab5" />
            </svg>
            OBTRADER <span>LIVE</span>
        </div>
        <select class="lang-select" id="langSelect" onchange="changeLanguage(this.value)">
            <option value="en" selected>EN 🇺🇸</option>
            <option value="zh">ZH 🇨🇳</option>
            <option value="tr">TR 🇹🇷</option>
            <option value="de">DE 🇩🇪</option>
            <option value="ko">KO 🇰🇷</option>
            <option value="es">ES 🇪🇸</option>
            <option value="ar">AR 🇸🇦</option>
            <option value="fr">FR 🇫🇷</option>
        </select>
    </div>

    <div class="tabs-container">
        <div class="tabs" id="tabList"></div>
        <button class="btn-add-tab" onclick="createNewTab()" id="btnNewTabTitle" title="New List">＋</button>
    </div>

    <div class="watch-grid" id="watchGrid"></div>

    <!-- GRAFİK VE TAHTA YAN YANA / ÜST ÜSTE ALANI -->
    <div class="chart-ob-wrapper">
        <!-- TRADINGVIEW CHART ALANI -->
        <div class="chart-container-box">
            <div class="chart-header" id="chartSymbolTitle">BTC/USDT Chart</div>
            <div class="tradingview-widget-container" id="tvChartContainer"></div>
        </div>

        <!-- TAHTA ALANI -->
        <div class="ob-drawer">
            <div class="ob-header">
                <span id="activeSymbolTitle">BTC/USDT</span>
                <span style="color: #848e9c; font-size: 11px;" id="lblDepth">Depth: 30x30</span>
            </div>
            
            <table class="orderbook-table">
                <thead>
                    <tr>
                        <th id="thPrice">Price ($)</th>
                        <th id="thAmount">Amount</th>
                        <th id="thTotal">Total ($)</th>
                    </tr>
                </thead>
            </table>

            <!-- Satış Emri Tablosu -->
            <div class="scrollable-table-container" id="asksContainer">
                <table class="orderbook-table">
                    <tbody id="asksTable" class="asks"></tbody>
                </table>
            </div>

            <!-- Ortadaki Sabit Canlı Fiyat Bandı -->
            <div class="mid-price-bar">
                <div class="mid-price-val" id="midPrice">--</div>
                <div class="mid-price-sub" id="midPriceSpread">Spread: --</div>
            </div>

            <!-- Alış Emri Tablosu -->
            <div class="scrollable-table-container" id="bidsContainer">
                <table class="orderbook-table">
                    <tbody id="bidsTable" class="bids"></tbody>
                </table>
            </div>

            <!-- Alım/Satım Oran Çizelgesi -->
            <div class="ratio-container">
                <div class="ratio-labels">
                    <span class="ratio-buy-text" id="ratioBuyText">Buy %50.0</span>
                    <span class="ratio-sell-text" id="ratioSellText">%50.0 Sell</span>
                </div>
                <div class="ratio-bar-bg">
                    <div class="ratio-bar-fill" id="ratioBarFill"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <!-- MODAL: Coin Ekleme -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <span class="modal-close-x" onclick="closeModal('addModal')">✕</span>
            <h3 id="modalAddTitle">Add Pair to Watchlist</h3>
            <div class="form-group">
                <label id="lblCoinSymbol">Coin Symbol</label>
                <input type="text" id="newSymbolInput" placeholder="e.g. solusdt or dogeusdt">
            </div>
            <div class="modal-buttons">
                <button class="btn btn-close" onclick="closeModal('addModal')" id="btnCancel">Cancel</button>
                <button class="btn btn-add" onclick="addNewSymbol()" id="btnAdd">Add</button>
            </div>
        </div>
    </div>

    <!-- MODAL: Alarm & Ayarlar -->
    <div class="modal" id="alarmModal">
        <div class="modal-content">
            <span class="modal-close-x" onclick="closeModal('alarmModal')">✕</span>
            <h3 id="alarmModalTitle">Settings & Alarm</h3>
            
            <div class="form-group">
                <label id="lblTargetPrice">1. Target Price Trigger ($)</label>
                <input type="number" id="alarmTargetPrice" step="any" placeholder="0.00">
            </div>
            
            <div class="form-group">
                <label id="lblWhaleVol">2. Whale Order Alarm (Min $ Volume)</label>
                <input type="number" id="alarmVolumeThreshold" step="10000" placeholder="250000">
            </div>

            <div class="form-group">
                <label id="lblAlarmType">Alarm Mode</label>
                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" name="alarmMode" value="once" checked> <span id="lblModeOnce">One-Time</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="alarmMode" value="persistent"> <span id="lblModePersistent">Persistent</span>
                    </label>
                </div>
            </div>

            <div class="active-alarms-box" id="activeAlarmsBox" style="display: none;">
                <div class="active-alarms-title" id="lblActiveAlarms">Active Alarms</div>
                <div id="activeAlarmsList"></div>
            </div>

            <div class="modal-buttons">
                <button class="btn btn-close" onclick="closeModal('alarmModal')" id="btnClose">Close</button>
                <button class="btn btn-add" onclick="saveAlarmSettings()" id="btnSaveAlarm">Save Alarm</button>
            </div>

            <span class="remove-coin-link" onclick="removeCurrentSymbol()" id="btnRemoveCoin">Remove this coin pair from list</span>
        </div>
    </div>

        // URL üzerinden Dil Algılama (Varsayılan EN)
        const urlParams = new URLSearchParams(window.location.search);
        let currentLang = urlParams.get('lang') || 'en';
        if (!i18n[currentLang]) currentLang = 'en';

        let lists = [
            {
                id: 'main',
                titleKey: 'mainList',
                title: i18n[currentLang].mainList,
                symbols: [
                    { symbol: 'btcusdt', name: 'BTC/USDT' },
                    { symbol: 'ethusdt', name: 'ETH/USDT' }
                ]
            }
        ];

        let activeListId = 'main';
        let selectedSymbol = 'btcusdt';
        let targetAlarmSymbol = '';
        let tickerWs, depthWs;
        let alarms = {};
        let lastPrices = {};
        let tvWidget = null;
        let isInitialAsksScrollDone = false;

        function changeLanguage(lang) {
            currentLang = lang;
            document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';

            // Select elementini güncelle
            document.getElementById('langSelect').value = lang;

            const t = i18n[lang];
            document.getElementById('lblDepth').innerText = t.depth;
            document.getElementById('thPrice').innerText = t.price;
            document.getElementById('thAmount').innerText = t.amount;
            document.getElementById('thTotal').innerText = t.total;
            document.getElementById('modalAddTitle').innerText = t.addModalTitle;
            document.getElementById('lblCoinSymbol').innerText = t.coinSymbol;
            document.getElementById('newSymbolInput').placeholder = t.symbolPlaceholder;
            document.getElementById('btnCancel').innerText = t.cancel;
            document.getElementById('btnAdd').innerText = t.add;
            document.getElementById('alarmModalTitle').innerText = t.settingsAlarm;
            document.getElementById('lblTargetPrice').innerText = t.targetPrice;
            document.getElementById('lblWhaleVol').innerText = t.whaleVol;
            document.getElementById('lblAlarmType').innerText = t.alarmType;
            document.getElementById('lblModeOnce').innerText = t.once;
            document.getElementById('lblModePersistent').innerText = t.persistent;
            document.getElementById('lblActiveAlarms').innerText = t.activeAlarms;
            document.getElementById('btnClose').innerText = t.close;
            document.getElementById('btnSaveAlarm').innerText = t.saveAlarm;
            document.getElementById('btnRemoveCoin').innerText = t.removeCoin;

            lists[0].title = t.mainList;
            renderTabs();
            renderWatchGrid();
        }

        function showToast(message) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.remove();
            }, 4000);
        }

        function renderTabs() {
            const container = document.getElementById('tabList');
            container.innerHTML = '';
            lists.forEach(list => {
                const tab = document.createElement('div');
                tab.className = `tab ${list.id === activeListId ? 'active' : ''}`;
                tab.innerText = list.title;
                tab.onclick = () => {
                    activeListId = list.id;
                    renderTabs();
                    renderWatchGrid();
                };
                container.appendChild(tab);
            });
        }

        function createNewTab() {
            const count = lists.length;
            const t = i18n[currentLang];
            const newList = {
                id: 'list_' + Date.now(),
                title: `${t.listPrefix} ${count}`,
                symbols: [
                    { symbol: 'solusdt', name: 'SOL/USDT' },
                    { symbol: 'bnbusdt', name: 'BNB/USDT' }
                ]
            };
            lists.push(newList);
            activeListId = newList.id;
            renderTabs();
            renderWatchGrid();
            connectTickerWs();
        }

        function renderWatchGrid() {
            const grid = document.getElementById('watchGrid');
            grid.innerHTML = '';
            const currentList = lists.find(l => l.id === activeListId);
            if (!currentList) return;

            currentList.symbols.forEach(item => {
                const card = document.createElement('div');
                card.className = `card ${item.symbol === selectedSymbol ? 'active' : ''}`;
                card.onclick = () => selectSymbol(item.symbol);

                const hasAlarm = alarms[item.symbol] && (alarms[item.symbol].targetPrice || alarms[item.symbol].volumeThreshold);

                card.innerHTML = `
                    <div class="card-header">
                        <span class="symbol-name">${item.name}</span>
                        <div class="header-right">
                            <span class="change" id="change-${item.symbol}">--%</span>
                            <div class="more-btn ${hasAlarm ? 'has-alarm' : ''}" onclick="openAlarmModal(event, '${item.symbol}')">⋮</div>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="price" id="price-${item.symbol}">--</div>
                    </div>
                `;
                grid.appendChild(card);
            });

            const addBox = document.createElement('div');
            addBox.className = 'card-add-box';
            addBox.onclick = () => openModal('addModal');
            addBox.innerHTML = `<span class="card-add-icon">＋</span>`;
            grid.appendChild(addBox);
        }

        function selectSymbol(sym) {
            selectedSymbol = sym;
            const currentList = lists.find(l => l.id === activeListId);
            const found = currentList ? currentList.symbols.find(s => s.symbol === sym) : null;
            const displayName = found ? found.name : sym.toUpperCase();

            document.getElementById('activeSymbolTitle').innerText = displayName;
            document.getElementById('chartSymbolTitle').innerText = `${displayName} Chart`;

            renderWatchGrid();
            initTradingViewWidget(sym);
            connectDepthWs(sym);
        }

        function initTradingViewWidget(sym) {
            const formattedSymbol = `BINANCE:${sym.toUpperCase()}`;
            document.getElementById('tvChartContainer').innerHTML = '';
            tvWidget = new TradingView.widget({
                "autosize": true,
                "symbol": formattedSymbol,
                "interval": "15",
                "timezone": "Etc/UTC",
                "theme": "dark",
                "style": "1",
                "locale": currentLang,
                "toolbar_bg": "#121418",
                "enable_publishing": false,
                "allow_symbol_change": true,
                "container_id": "tvChartContainer"
            });
        }

        function openModal(id) {
            document.getElementById(id).style.display = 'flex';
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        function addNewSymbol() {
            const input = document.getElementById('newSymbolInput');
            let raw = input.value.trim().toLowerCase();
            if (!raw) return;
            if (!raw.endsWith('usdt')) raw += 'usdt';

            const name = raw.replace('usdt', '').toUpperCase() + '/USDT';
            const currentList = lists.find(l => l.id === activeListId);
            if (currentList) {
                if (!currentList.symbols.find(s => s.symbol === raw)) {
                    currentList.symbols.push({ symbol: raw, name });
                }
            }
            input.value = '';
            closeModal('addModal');
            renderWatchGrid();
            connectTickerWs();
            selectSymbol(raw);
        }

        function openAlarmModal(event, sym) {
            event.stopPropagation();
            targetAlarmSymbol = sym;
            const currentAlarm = alarms[sym] || {};
            
            document.getElementById('alarmTargetPrice').value = currentAlarm.targetPrice || '';
            document.getElementById('alarmVolumeThreshold').value = currentAlarm.volumeThreshold || '';

            const mode = currentAlarm.mode || 'once';
            const radios = document.getElementsByName('alarmMode');
            radios.forEach(r => r.checked = (r.value === mode));

            renderActiveAlarmsList(sym);
            openModal('alarmModal');
        }

        function renderActiveAlarmsList(sym) {
            const box = document.getElementById('activeAlarmsBox');
            const listContainer = document.getElementById('activeAlarmsList');
            const current = alarms[sym];
            const t = i18n[currentLang];

            if (current && (current.targetPrice || current.volumeThreshold)) {
                box.style.display = 'block';
                listContainer.innerHTML = '';

                if (current.targetPrice) {
                    listContainer.innerHTML += `
                        <div class="alarm-item">
                            <span>${t.alarmTargetText}: $${current.targetPrice} (${current.mode === 'once' ? t.once : t.persistent})</span>
                            <span class="alarm-delete" onclick="clearSpecificAlarm('${sym}', 'targetPrice')">✕</span>
                        </div>
                    `;
                }

                if (current.volumeThreshold) {
                    listContainer.innerHTML += `
                        <div class="alarm-item">
                            <span>${t.alarmVolText}: $${Number(current.volumeThreshold).toLocaleString()}</span>
                            <span class="alarm-delete" onclick="clearSpecificAlarm('${sym}', 'volumeThreshold')">✕</span>
                        </div>
                    `;
                }
            } else {
                box.style.display = 'none';
            }
        }

        function clearSpecificAlarm(sym, type) {
            if (alarms[sym]) {
                delete alarms[sym][type];
                if (!alarms[sym].targetPrice && !alarms[sym].volumeThreshold) {
                    delete alarms[sym];
                }
            }
            renderActiveAlarmsList(sym);
            renderWatchGrid();
        }

        function saveAlarmSettings() {
            const targetPrice = parseFloat(document.getElementById('alarmTargetPrice').value);
            const volumeThreshold = parseFloat(document.getElementById('alarmVolumeThreshold').value);
            const mode = document.querySelector('input[name="alarmMode"]:checked').value;
            const t = i18n[currentLang];

            if (!targetAlarmSymbol) return;

            if (!alarms[targetAlarmSymbol]) alarms[targetAlarmSymbol] = {};

            if (!isNaN(targetPrice) && targetPrice > 0) {
                alarms[targetAlarmSymbol].targetPrice = targetPrice;
            } else {
                delete alarms[targetAlarmSymbol].targetPrice;
            }

            if (!isNaN(volumeThreshold) && volumeThreshold > 0) {
                alarms[targetAlarmSymbol].volumeThreshold = volumeThreshold;
            } else {
                delete alarms[targetAlarmSymbol].volumeThreshold;
            }

            alarms[targetAlarmSymbol].mode = mode;

            if (!alarms[targetAlarmSymbol].targetPrice && !alarms[targetAlarmSymbol].volumeThreshold) {
                delete alarms[targetAlarmSymbol];
            }

            closeModal('alarmModal');
            renderWatchGrid();
            showToast(t.toastSaved.replace('{sym}', targetAlarmSymbol.toUpperCase()));
        }

        function removeCurrentSymbol() {
            const t = i18n[currentLang];
            const currentList = lists.find(l => l.id === activeListId);
            if (currentList) {
                currentList.symbols = currentList.symbols.filter(s => s.symbol !== targetAlarmSymbol);
                delete alarms[targetAlarmSymbol];
            }
            closeModal('alarmModal');
            renderWatchGrid();

            if (selectedSymbol === targetAlarmSymbol && currentList.symbols.length > 0) {
                selectSymbol(currentList.symbols[0].symbol);
            }
            showToast(t.toastRemoved.replace('{sym}', targetAlarmSymbol.toUpperCase()));
        }

        function getAllTrackedSymbols() {
            const set = new Set();
            lists.forEach(l => {
                l.symbols.forEach(s => set.add(s.symbol));
            });
            return Array.from(set);
        }

        function connectTickerWs() {
            if (tickerWs) tickerWs.close();
            const symbols = getAllTrackedSymbols();
            if (symbols.length === 0) return;

            const streams = symbols.map(s => `${s}@ticker`).join('/');
            tickerWs = new WebSocket(`wss://stream.binance.com:9443/ws/${streams}`);

            tickerWs.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data && data.s) {
                    const sym = data.s.toLowerCase();
                    const price = parseFloat(data.c);
                    const change = parseFloat(data.P);

                    const priceEl = document.getElementById(`price-${sym}`);
                    const changeEl = document.getElementById(`change-${sym}`);

                    if (priceEl) {
                        priceEl.innerText = price > 10 ? price.toFixed(2) : price.toFixed(4);
                    }
                    if (changeEl) {
                        changeEl.innerText = `${change >= 0 ? '+' : ''}${change.toFixed(2)}%`;
                        changeEl.className = `change ${change >= 0 ? 'up' : 'down'}`;
                    }

                    checkPriceAlarm(sym, price);
                }
            };
        }

        function checkPriceAlarm(sym, price) {
            const alarm = alarms[sym];
            if (!alarm || !alarm.targetPrice) return;

            const lastPrice = lastPrices[sym] || price;
            const target = alarm.targetPrice;
            const t = i18n[currentLang];

            if ((lastPrice < target && price >= target) || (lastPrice > target && price <= target)) {
                showToast(t.toastPrice.replace('{sym}', sym.toUpperCase()).replace('{target}', target));
                if (alarm.mode === 'once') {
                    delete alarm.targetPrice;
                    if (!alarm.volumeThreshold) delete alarms[sym];
                    renderWatchGrid();
                }
            }
            lastPrices[sym] = price;
        }

        function connectDepthWs(sym) {
            if (depthWs) depthWs.close();
            isInitialAsksScrollDone = false;

            depthWs = new WebSocket(`wss://stream.binance.com:9443/ws/${sym}@depth20@100ms`);

            depthWs.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data && data.asks && data.bids) {
                    renderOrderBook(data.asks, data.bids, sym);
                }
            };
        }

        function renderOrderBook(asks, bids, sym) {
            const asksTable = document.getElementById('asksTable');
            const bidsTable = document.getElementById('bidsTable');
            const midPriceEl = document.getElementById('midPrice');
            const spreadEl = document.getElementById('midPriceSpread');
            const t = i18n[currentLang];

            asksTable.innerHTML = '';
            bidsTable.innerHTML = '';

            let totalAskVol = 0;
            let totalBidVol = 0;

            const alarm = alarms[sym];
            const volThreshold = alarm ? alarm.volumeThreshold : null;

            // Satışlar (Asks)
            const sortedAsks = [...asks].slice(0, 15).reverse();
            sortedAsks.forEach(item => {
                const price = parseFloat(item[0]);
                const amount = parseFloat(item[1]);
                const total = price * amount;
                totalAskVol += total;

                if (volThreshold && total >= volThreshold) {
                    showToast(t.toastWhaleSell.replace('{sym}', sym.toUpperCase()).replace('{vol}', Math.round(total).toLocaleString()));
                }

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="price">${price > 10 ? price.toFixed(2) : price.toFixed(4)}</td>
                    <td>${amount.toFixed(3)}</td>
                    <td>${Math.round(total).toLocaleString()}</td>
                `;
                asksTable.appendChild(tr);
            });

            // Alışlar (Bids)
            const sortedBids = [...bids].slice(0, 15);
            sortedBids.forEach(item => {
                const price = parseFloat(item[0]);
                const amount = parseFloat(item[1]);
                const total = price * amount;
                totalBidVol += total;

                if (volThreshold && total >= volThreshold) {
                    showToast(t.toastWhaleBuy.replace('{sym}', sym.toUpperCase()).replace('{vol}', Math.round(total).toLocaleString()));
                }

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="price">${price > 10 ? price.toFixed(2) : price.toFixed(4)}</td>
                    <td>${amount.toFixed(3)}</td>
                    <td>${Math.round(total).toLocaleString()}</td>
                `;
                bidsTable.appendChild(tr);
            });

            // Orta Fiyat ve Spread
            if (asks.length > 0 && bids.length > 0) {
                const bestAsk = parseFloat(asks[0][0]);
                const bestBid = parseFloat(bids[0][0]);
                const mid = (bestAsk + bestBid) / 2;
                const spread = bestAsk - bestBid;

                midPriceEl.innerText = mid > 10 ? mid.toFixed(2) : mid.toFixed(4);
                spreadEl.innerText = `Spread: ${spread.toFixed(2)}`;
            }

            // Alım/Satım Oranı Barı
            const grandTotal = totalAskVol + totalBidVol;
            if (grandTotal > 0) {
                const buyPct = ((totalBidVol / grandTotal) * 100).toFixed(1);
                const sellPct = ((totalAskVol / grandTotal) * 100).toFixed(1);

                document.getElementById('ratioBuyText').innerText = `${t.buyText} %${buyPct}`;
                document.getElementById('ratioSellText').innerText = `%${sellPct} ${t.sellText}`;
                document.getElementById('ratioBarFill').style.width = `${buyPct}%`;
            }

            // Asks Tablosunu Aşağıya Kaydır (İlk Yükleme)
            if (!isInitialAsksScrollDone) {
                const asksContainer = document.getElementById('asksContainer');
                asksContainer.scrollTop = asksContainer.scrollHeight;
                isInitialAsksScrollDone = true;
            }
        }

        window.onload = () => {
            changeLanguage(currentLang);
            selectSymbol(selectedSymbol);
            connectTickerWs();
        };
    </script>
